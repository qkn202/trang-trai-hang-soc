    <script>
      (function () {
        var params;
        try {
          params = new URLSearchParams(window.location.search);
        } catch (_e) {
          params = null;
        }
        var forceClear = Boolean(
          params && (params.has('clearcache') || params.has('nocache') || params.has('fresh'))
        );
        var isViteDev =
          window.location.port === '5173' ||
          Boolean(document.querySelector('script[src*="/@vite/client"]'));

        if (isViteDev || forceClear) {
          var hadController = Boolean(
            'serviceWorker' in navigator && navigator.serviceWorker.controller
          );
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  (regs || []).map(function (r) {
                    return r.unregister();
                  })
                ).then(function () {
                  return Boolean(regs && regs.length > 0);
                });
              })
            );
          }
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  })
                ).then(function () {
                  return Boolean(keys && keys.length > 0);
                });
              })
            );
          }
          Promise.all(tasks)
            .then(function (results) {
              var purgedAnything = hadController || results.some(Boolean);
              if (forceClear && params) {
                params.delete('clearcache');
                params.delete('nocache');
                params.delete('fresh');
                params.set('_v', String(Date.now()));
                var nextUrl =
                  window.location.pathname +
                  '?' +
                  params.toString() +
                  (window.location.hash || '');
                window.location.replace(nextUrl);
                return;
              }
              if (purgedAnything && !sessionStorage.getItem('hangsoc_dev_sw_cleared')) {
                sessionStorage.setItem('hangsoc_dev_sw_cleared', '1');
                window.location.reload();
              } else {
                sessionStorage.removeItem('hangsoc_dev_sw_cleared');
              }
            })
            .catch(function () {});
          return;
        }

        if (!('serviceWorker' in navigator)) return;
        var hadInitialSw = Boolean(navigator.serviceWorker.controller);
        var refreshingSw = false;
        var pendingSwReload = false;
        function performSafeSwReload() {
          if (refreshingSw) return;
          refreshingSw = true;
          try {
            window.dispatchEvent(new Event('hangsoc:before-sw-reload'));
          } catch (e) {}
          window.location.reload();
        }
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadInitialSw || refreshingSw || pendingSwReload) return;
          if (document.querySelector('dialog[open]')) {
            pendingSwReload = true;
            document.addEventListener(
              'close',
              function onOpenDialogClosed() {
                setTimeout(function () {
                  if (!document.querySelector('dialog[open]')) {
                    document.removeEventListener('close', onOpenDialogClosed, true);
                    performSafeSwReload();
                  }
                }, 120);
              },
              true
            );
            return;
          }
          performSafeSwReload();
        });
        window.addEventListener('load', function () {
          try {
            navigator.serviceWorker
              .register('./sw.js')
              .then(function (reg) {
                if (reg && typeof reg.update === 'function') {
                  reg.update().catch(function () {});
                }
                console.log('Hang Soc SW registered, scope:', reg.scope);
              })
              .catch(function (err) {
                console.warn('SW registration failed:', err);
              });
          } catch (err) {
            console.warn('SW register error:', err);
          }
        });
      })();
    </script>

    <script>
      // Cảnh báo an toàn khi mở index.html sai cách (double-click → file:// hoặc
      // server tĩnh không chạy Vite): thay vì trang trắng, hiện hướng dẫn chạy đúng.
      (function () {
        function showHelp() {
          var app = document.getElementById('app');
          if (!app || app.children.length > 0) return; // game đã chạy được thì không can thiệp
          app.innerHTML =
            '<div id="hangsoc-file-open-help" style="max-width:560px;margin:10vh auto;padding:28px;border:1.5px solid #4f2813;' +
            'border-radius:14px;background:#fdf4dc;color:#241912;font-family:\'Be Vietnam Pro\',system-ui,sans-serif;' +
            'line-height:1.65;text-align:left">' +
            '<div style="font-family:\'Playfair Display\',serif;font-size:20px;font-weight:800;margin-bottom:10px">' +
            '🏡 Chưa chạy được game — file index.html không tự chạy khi được click trực tiếp.</div>' +
            '<div>Đây là ứng dụng <b>Vite + TypeScript</b>: cần dev server để biên dịch code. ' +
            'Chọn một trong hai:</div>' +
            '<div style="margin:12px 0"><b>1. Double-click file <code style="background:#f5e9c8;padding:2px 6px;border-radius:6px">Chơi Game.command</code></b> ' +
            'ở thư mục game (macOS sẽ tự chạy và mở trình duyệt).</div>' +
            '<div style="margin-bottom:12px"><b>2. Chạy bằng Terminal trong thư mục game:</b><br>' +
            '<code style="display:inline-block;margin-top:6px;background:#f5e9c8;padding:6px 10px;border-radius:6px">' +
            'npm install &amp;&amp; npm run dev</code> — rồi mở <b>http://localhost:5173</b></div>' +
            '<div style="font-size:12.5px;opacity:.75">Lưu ý: luôn nhấp chuột VÀO TRANG WEB (http://...) — không phải click vào file .html.</div>' +
            '</div>';
        }
        var t1 = setTimeout(showHelp, 2500); // server tĩnh (không Vite): module không load được
        if (location.protocol === 'file:') { showHelp(); clearTimeout(t1); }
      })();
    </script>
