<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#241912" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trang Trại Hang Sóc" />
    <!-- Online services connect-src 'self' covers /api/save and /api/track. TODO: add https://<domain> if Cloudflare Worker is hosted on a separate external domain -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self';"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Trang Trại Hang Sóc &amp; Thung Lũng Hogsmeade — Cozy Wizarding Farm</title>
    <link
      rel="preload"
      href="/fonts/be-vietnam-pro-600-vietnamese.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/be-vietnam-pro-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #241912;
      }
    </style>
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var isViteDev = Boolean(document.querySelector('script[src*="/@vite/client"]'));
        if (isViteDev) {
          var hadController = Boolean(navigator.serviceWorker.controller);
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              var hasRegs = regs && regs.length > 0;
              var cleanupPromises = (regs || []).map(function (r) {
                return r.unregister();
              });
              if ('caches' in window) {
                cleanupPromises.push(
                  caches.keys().then(function (keys) {
                    return Promise.all(
                      keys.map(function (k) {
                        return caches.delete(k);
                      })
                    );
                  })
                );
              }
              return Promise.all(cleanupPromises).then(function () {
                if ((hadController || hasRegs) && !sessionStorage.getItem('hangsoc_dev_sw_cleared')) {
                  sessionStorage.setItem('hangsoc_dev_sw_cleared', '1');
                  window.location.reload();
                } else {
                  sessionStorage.removeItem('hangsoc_dev_sw_cleared');
                }
              });
            })
            .catch(function () {});
          return;
        }
        var hadInitialSw = Boolean(navigator.serviceWorker.controller);
        var refreshingSw = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!hadInitialSw || refreshingSw) return;
          refreshingSw = true;
          window.location.reload();
        });
        window.addEventListener('load', function () {
          try {
            navigator.serviceWorker
              .register('/sw.js')
              .then(function (reg) {
                if (reg && typeof reg.update === 'function') {
                  reg.update().catch(function () {});
                }
                console.log('Hang Soc SW registered, scope:', reg.scope);
              })
              .catch(function (err) {
                console.warn('SW registration failed:', err);
              });
          } catch (err) {
            console.warn('SW register error:', err);
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/ui/onlineBootstrap.ts"></script>
    <script>
      // Cảnh báo an toàn khi mở index.html sai cách (double-click → file:// hoặc
      // server tĩnh không chạy Vite): thay vì trang trắng, hiện hướng dẫn chạy đúng.
      (function () {
        function showHelp() {
          var app = document.getElementById('app');
          if (!app || app.children.length > 0) return; // game đã chạy được thì không can thiệp
          app.innerHTML =
            '<div id="hangsoc-file-open-help" style="max-width:560px;margin:10vh auto;padding:28px;border:1.5px solid #4f2813;' +
            'border-radius:14px;background:#fdf4dc;color:#241912;font-family:\'Be Vietnam Pro\',system-ui,sans-serif;' +
            'line-height:1.65;text-align:left">' +
            '<div style="font-family:\'Playfair Display\',serif;font-size:20px;font-weight:800;margin-bottom:10px">' +
            '🏡 Chưa chạy được game — file index.html không tự chạy khi được click trực tiếp.</div>' +
            '<div>Đây là ứng dụng <b>Vite + TypeScript</b>: cần dev server để biên dịch code. ' +
            'Chọn một trong hai:</div>' +
            '<div style="margin:12px 0"><b>1. Double-click file <code style="background:#f5e9c8;padding:2px 6px;border-radius:6px">Chơi Game.command</code></b> ' +
            'ở thư mục game (macOS sẽ tự chạy và mở trình duyệt).</div>' +
            '<div style="margin-bottom:12px"><b>2. Chạy bằng Terminal trong thư mục game:</b><br>' +
            '<code style="display:inline-block;margin-top:6px;background:#f5e9c8;padding:6px 10px;border-radius:6px">' +
            'npm install &amp;&amp; npm run dev</code> — rồi mở <b>http://localhost:5173</b></div>' +
            '<div style="font-size:12.5px;opacity:.75">Lưu ý: luôn nhấp chuột VÀO TRANG WEB (http://...) — không phải click vào file .html.</div>' +
            '</div>';
        }
        var t1 = setTimeout(showHelp, 2500); // server tĩnh (không Vite): module không load được
        if (location.protocol === 'file:') { showHelp(); clearTimeout(t1); }
      })();
    </script>
  </body>
</html>
