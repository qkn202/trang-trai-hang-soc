<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#241912" />
    <title>Hang Sóc Mini-games Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background: #241912;
        color: #fff8eb;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 24rem;
        background: #3b281c;
        border: 1.5px solid #f59e0b;
        border-radius: 1rem;
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.6rem;
        font-size: 1.3rem;
        color: #fde047;
      }
      p {
        margin: 0 0 1.1rem;
        color: #d6c3a5;
        line-height: 1.5;
        font-size: 0.92rem;
      }
      a {
        display: inline-block;
        padding: 0.65rem 1.2rem;
        border-radius: 0.7rem;
        background: #f59e0b;
        color: #241912;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🦉 Hang Sóc Mini-games Offline</h1>
      <p>
        Thiết bị đang ở chế độ Ngoại tuyến. Nhấn nút bên dưới để quay lại sảnh 5
        mini-game đã lưu trên máy.
      </p>
      <a href="./">Mở Hang Sóc Games</a>
    </div>
  </body>
</html>
