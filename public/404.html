<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Trại Hang Sóc &amp; Thung Lũng Hogsmeade</title>
    <script>
      (function () {
        var loc = window.location;
        var segs = loc.pathname.split('/').filter(Boolean);
        var base =
          segs.length > 0 && segs[0] === 'trang-trai-hang-soc'
            ? '/trang-trai-hang-soc/'
            : '/';
        loc.replace(base + (loc.search || '') + (loc.hash || ''));
      })();
    </script>
  </head>
  <body style="background:#241912;color:#f8ebd2;font-family:sans-serif;text-align:center;padding-top:20vh;">
    <p>Đang trở về Trang Trại Hang Sóc...</p>
  </body>
</html>
