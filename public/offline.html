<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#241912" />
    <title>Mất kết nối — Trang Trại Hang Sóc</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      :root {
        --surface-parchment: #fdf4dc;
        --surface-panel-solid: #fff9e8;
        --surface-dark: #2b190d;
        --ink: #4a2c16;
        --ink-soft: #7a5638;
        --gold: #f5b301;
        --gold-deep: #c98a00;
        --border-brass: #b07d43;
        --shadow-deep: rgba(36, 23, 19, 0.45);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: radial-gradient(circle at 50% 40%, #3e2413 0%, #2b190d 65%, #190e07 100%);
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }

      .offline-card {
        background: var(--surface-parchment);
        border: 3px solid var(--border-brass);
        border-radius: 24px;
        box-shadow:
          0 16px 36px var(--shadow-deep),
          0 0 0 1px rgba(255, 255, 255, 0.4) inset,
          0 0 20px rgba(176, 125, 67, 0.15) inset;
        max-width: 440px;
        width: 100%;
        padding: 40px 32px;
        text-align: center;
        position: relative;
        animation: card-appear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes card-appear {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .icon-wrap {
        width: 88px;
        height: 88px;
        margin: 0 auto 20px;
        background: #fff5da;
        border: 2.5px solid var(--border-brass);
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px rgba(74, 44, 22, 0.18);
      }

      .icon-wrap svg {
        width: 48px;
        height: 48px;
        color: #b45309;
      }

      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 26px;
        font-weight: 800;
        color: var(--ink);
        margin-bottom: 12px;
        line-height: 1.25;
      }

      p.desc {
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink-soft);
        margin-bottom: 28px;
      }

      .btn-retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        max-width: 240px;
        padding: 13px 24px;
        background: linear-gradient(180deg, #ffc72c 0%, #e59d00 100%);
        color: #3a2211;
        font-family: 'Be Vietnam Pro', sans-serif;
        font-size: 15px;
        font-weight: 700;
        border: 2px solid #8f5d17;
        border-radius: 999px;
        box-shadow:
          0 4px 0 #8f5d17,
          0 8px 16px rgba(74, 44, 22, 0.25);
        cursor: pointer;
        user-select: none;
        transition: transform 0.08s ease, box-shadow 0.08s ease;
        outline: none;
      }

      .btn-retry:hover {
        background: linear-gradient(180deg, #ffd352 0%, #f0aa0a 100%);
      }

      .btn-retry:active {
        transform: translateY(3px);
        box-shadow:
          0 1px 0 #8f5d17,
          0 3px 8px rgba(74, 44, 22, 0.2);
      }

      .hint {
        margin-top: 22px;
        font-size: 12.5px;
        color: #926947;
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <h1>Không có mạng</h1>
      <p class="desc">
        Cú đưa thư dường như bị lạc trong sương mù! Vui lòng kiểm tra lại kết nối Wi-Fi hoặc dữ liệu di động để tiếp tục khám phá Trang Trại Hang Sóc.
      </p>

      <button id="retry-btn" class="btn-retry" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Thử lại</span>
      </button>

      <p class="hint">🌾 Trang Trại Hang Sóc &amp; Thung Lũng Hogsmeade</p>
    </main>

    <script>
      document.getElementById('retry-btn').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
