name = "hang-soc-online-api"
main = "index.ts"
compatibility_date = "2024-09-23"

# ============================================================
# Cấu hình Cloudflare Worker cho 'Trang Trại Hang Sóc'
# Cung cấp 2 API routes: /api/save và /api/track
# ============================================================

# KV Namespace binding cho Cloud Save & Analytics logs
# Để tạo KV namespace thật trên tài khoản Cloudflare, chạy:
#   npx wrangler kv namespace create SAVE_KV
#   npx wrangler kv namespace create SAVE_KV --preview
# Sau đó dán ID vào bên dưới:
[[kv_namespaces]]
binding = "SAVE_KV"
id = "PLACEHOLDER_SAVE_KV_ID"
preview_id = "PLACEHOLDER_SAVE_KV_PREVIEW_ID"

# Khi gắn domain riêng vào Cloudflare Pages / Worker:
# routes = [
#   { pattern = "*hangsoc.game/api/save*", zone_name = "hangsoc.game" },
#   { pattern = "*hangsoc.game/api/track*", zone_name = "hangsoc.game" }
# ]
