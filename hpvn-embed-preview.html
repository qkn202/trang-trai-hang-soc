<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HPVN Host Shell Preview (/phongsinhoatchung) — Trang Trại Hang Sóc</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      :root {
        --bg: #1a120d;
        --panel: #2b1d14;
        --border: #6b4628;
        --gold: #f5c451;
        --text: #fdf4dc;
        --muted: #cbb799;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .hpvn-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1.5px solid var(--border);
        font-size: 12.5px;
      }
      .hpvn-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        color: var(--gold);
      }
      .hpvn-chip {
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(245, 196, 81, 0.14);
        border: 1px solid rgba(245, 196, 81, 0.35);
        color: var(--text);
        font-size: 11.5px;
      }
      .hpvn-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      button {
        appearance: none;
        border: 1px solid var(--border);
        background: #3b271a;
        color: var(--text);
        padding: 5px 10px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--gold);
        color: var(--gold);
      }
      .frame-wrap {
        flex: 1;
        position: relative;
        width: 100%;
        height: 100%;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      .floo-banner {
        display: none;
        padding: 8px 14px;
        background: #233824;
        border-bottom: 1px solid #4d8b55;
        color: #e6ffe9;
        font-size: 12px;
      }
      .floo-banner.show {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
      }
      .floo-banner img {
        width: 128px;
        height: 76px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #86efac;
      }
      .floo-banner button {
        appearance: none;
        border: 1px solid #86efac;
        background: #166534;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        padding: 5px 10px;
        border-radius: 999px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header class="hpvn-bar">
      <div class="hpvn-brand">
        <span>🏰 HPVN Shell (/phongsinhoatchung)</span>
        <span id="statusChip" class="hpvn-chip">Đang chờ iframe #burrow-ticket…</span>
        <span id="rpcChip" class="hpvn-chip">RPC: 0 · asia-southeast1</span>
      </div>
      <div class="hpvn-controls">
        <button type="button" id="btnTourBurrow">🏛️ Tour Hang Sóc</button>
        <button type="button" data-atmo="day">☀️ Ngày</button>
        <button type="button" data-atmo="dusk">🌅 Hoàng hôn</button>
        <button type="button" data-atmo="night">🌙 Đêm</button>
        <button type="button" data-weather="clear">🌤️ Quang</button>
        <button type="button" data-weather="rain">🌧️ Mưa</button>
        <button type="button" data-weather="snow">❄️ Tuyết</button>
        <button type="button" data-weather="fireflies">✨ Đom đóm</button>
        <button type="button" id="btnMute">🔊 Tắt/Bật tiếng</button>
      </div>
    </header>
    <div id="flooBanner" class="floo-banner"></div>
    <main class="frame-wrap">
      <iframe
        id="gardenFrame"
        title="Trang Trại Hang Sóc (HPVN Embedded)"
        sandbox="allow-scripts allow-same-origin allow-modals allow-downloads"
      ></iframe>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var uid = params.get('uid') || 'hpvn_member_harry';
        var useEmulator = params.get('emulator') === '1';
        var functionsPort = Number(params.get('functionsPort') || 5001) || 5001;
        var projectId = params.get('project') || 'demo-hpvnn-burrow';
        var nonce =
          'hpvn_' +
          Math.random().toString(36).slice(2, 10) +
          '_' +
          Date.now().toString(36);

        var statusChip = document.getElementById('statusChip');
        var rpcChip = document.getElementById('rpcChip');
        var flooBanner = document.getElementById('flooBanner');
        var iframe = document.getElementById('gardenFrame');
        var muted = false;
        var rpcCount = 0;
        var sessionToken = null;

        function b64Url(str) {
          return btoa(unescape(encodeURIComponent(str)))
            .replace(/\+/g, '-')
            .replace(/\//g, '_')
            .replace(/=+$/, '');
        }

        function createFixtureToken(targetUid) {
          var now = Math.floor(Date.now() / 1000);
          var hdr = b64Url(JSON.stringify({ alg: 'none', typ: 'JWT' }));
          var pld = b64Url(
            JSON.stringify({
              iss: 'https://securetoken.google.com/' + projectId,
              aud: projectId,
              user_id: targetUid,
              sub: targetUid,
              iat: now,
              exp: now + 3600,
            })
          );
          return hdr + '.' + pld + '.';
        }

        async function ensureToken() {
          if (useEmulator) return createFixtureToken(uid);
          if (sessionToken) return sessionToken;
          try {
            var r = await fetch('/api/auth/session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'X-User-Id': uid },
              body: JSON.stringify({ uid: uid }),
            });
            if (r.ok) {
              var b = await r.json();
              sessionToken = b.token || null;
            }
          } catch (_e) {}
          return sessionToken;
        }

        async function forwardCallable(callableName, data) {
          var token = await ensureToken();
          var url = useEmulator
            ? 'http://127.0.0.1:' + functionsPort + '/' + projectId + '/asia-southeast1/' + callableName
            : '/api/rpc/' + callableName;
          var headers = { 'Content-Type': 'application/json', 'X-User-Id': uid };
          if (token) headers.Authorization = 'Bearer ' + token;
          var res = await fetch(url, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ data: data || {} }),
          });
          var body = await res.json();
          if (body.error || !res.ok) {
            var err = new Error((body.error && body.error.message) || 'RPC refused');
            err.definitive = res.status < 500;
            err.reason = body.error && body.error.details && body.error.details.reason;
            err.details = (body.error && body.error.details) || {};
            throw err;
          }
          return body.result || {};
        }

        window.addEventListener('message', async function (event) {
          if (event.source !== iframe.contentWindow) return;
          var m = event.data;
          if (!m || typeof m !== 'object') return;

          // 1. Kênh RPC Ủy Quyền Độc Lập (#burrow-ticket / channel: 'hpvn-burrow-game')
          if (m.channel === 'hpvn-burrow-game' && m.nonce === nonce && typeof m.id === 'string') {
            if (m.action === 'burrow') {
              rpcCount += 1;
              rpcChip.textContent =
                'RPC: ' +
                rpcCount +
                ' (' +
                m.name +
                ') · ' +
                (useEmulator ? 'Emulator :5001' : 'asia-southeast1');
              try {
                var result = await forwardCallable(m.name, m.data);
                iframe.contentWindow.postMessage(
                  { channel: 'hpvn-burrow-game', nonce: nonce, id: m.id, result: result },
                  '*'
                );
              } catch (err) {
                iframe.contentWindow.postMessage(
                  {
                    channel: 'hpvn-burrow-game',
                    nonce: nonce,
                    id: m.id,
                    error: err.message || 'Lỗi máy chủ',
                    definitive: err.definitive === true,
                    reason: err.reason,
                    details: err.details || {},
                  },
                  '*'
                );
              }
            } else {
              if (m.action === 'floo-share' && m.data && typeof m.data === 'object') {
                renderFlooShareBanner(m.data);
              }
              iframe.contentWindow.postMessage(
                { channel: 'hpvn-burrow-game', nonce: nonce, id: m.id, result: { ok: true } },
                '*'
              );
            }
            return;
          }

          // 2. Kênh Cầu Nối Giao Diện & Mạng Floo Độc Lập (source: 'hpvn-burrow-garden')
          if (m.source === 'hpvn-burrow-garden') {
            var p = m.payload || {};
            if (m.type === 'hpvn:burrow:ready') {
              statusChip.textContent = '✓ Đã kết nối (' + (p.protocol || 'burrow-hpvnn') + ')';
            } else if (m.type === 'hpvn:burrow:state') {
              statusChip.textContent =
                '🏰 ' +
                (p.parkName || 'Hang Sóc') +
                ' · Lv.' +
                (p.level || 1) +
                ' · 🌟 ' +
                (p.magicStars || 0);
            } else if (m.type === 'hpvn:burrow:share-floo') {
              renderFlooShareBanner(p);
            }
          }
        });

        function renderFlooShareBanner(p) {
          flooBanner.textContent = '';
          if (p.image && typeof p.image === 'string' && p.image.indexOf('data:image/') === 0) {
            var img = document.createElement('img');
            img.src = p.image;
            img.alt = 'Bưu thiếp thung lũng';
            flooBanner.appendChild(img);
          }
          var txt = document.createElement('span');
          txt.textContent = '🔥 Mạng Floo (/phongsinhoatchung): ' + (p.text || 'Mời bạn ghé thăm thung lũng!');
          flooBanner.appendChild(txt);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = '🔥 Bay Floo sang thăm';
          btn.addEventListener('click', function () {
            sendHostCommand('hpvn:burrow:tour-garden', { tourId: p.tourId || 'tour_burrow' });
          });
          flooBanner.appendChild(btn);
          flooBanner.classList.add('show');
        }

        function sendHostCommand(type, payload) {
          if (!iframe.contentWindow) return;
          iframe.contentWindow.postMessage(
            {
              source: 'hpvn-host-shell',
              version: '25.1',
              type: type,
              payload: payload,
              sentAt: Date.now(),
            },
            '*'
          );
        }

        document.getElementById('btnTourBurrow').addEventListener('click', function () {
          sendHostCommand('hpvn:burrow:tour-garden', { tourId: 'tour_burrow' });
        });

        document.querySelectorAll('[data-atmo]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            sendHostCommand('hpvn:burrow:set-atmosphere', { mode: btn.getAttribute('data-atmo') });
          });
        });

        document.querySelectorAll('[data-weather]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            sendHostCommand('hpvn:burrow:set-weather', { mode: btn.getAttribute('data-weather') });
          });
        });

        document.getElementById('btnMute').addEventListener('click', function () {
          muted = !muted;
          sendHostCommand('hpvn:burrow:mute', { muted: muted });
        });

        iframe.src = '/?tutorial=0#burrow-ticket=' + encodeURIComponent(nonce);
      })();
    </script>
  </body>
</html>
