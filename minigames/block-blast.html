<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#381b0c" />
  <title>Khảm Ngọc Hang Sóc — Block Blast × Tetris</title>
  <link rel="preload" href="../fonts/be-vietnam-pro-700-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../fonts/be-vietnam-pro-700-vietnamese.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <style>
    /* =====================================================================
       TRANG TRẠI HANG SÓC — EXACT PALETTE TOKENS (--hs-* & --farm-*)
       ===================================================================== */
    :root {
      color-scheme: light;
      /* Official HPVN & Hang Sóc tokens from src/styles/main.css */
      --hs-paper: #fdf4dc;
      --hs-paper-2: #f6e4b8;
      --hs-ink: #4a2c16;
      --hs-ink-soft: #7a5638;
      --hs-cream: #fff6dc;
      --hs-wood: #381b0c;
      --hs-wood-2: #6e391c;
      --hs-brass: #b07d43;
      --hs-brass-bright: #f4c668;
      --hs-gold-bright: #ffe484;
      --hs-gold: #f5b301;
      --hs-gold-deep: #c98a00;
      --hs-forest: #142620;
      --hs-forest-2: #24483f;
      --hs-ok: #22780f;
      --hs-ok-bg: #e7f9d4;
      --hs-bad: #b93822;
      --hs-bad-bg: #fff1ed;
      --hs-shade: rgba(74, 44, 22, 0.34);

      --farm-wood-darkest: #381b0c;
      --farm-wood-dark: #4f2813;
      --farm-wood-mid: #6e391c;
      --farm-wood-warm: #874925;
      --farm-wood-well: #3f1f0e;
      --farm-brass-bright: #f4c668;
      --farm-brass-mid: #d4963b;
      --farm-brass-dark: #8c5919;
      --farm-sheet-top: #fffcf4;
      --farm-sheet-bot: #f4e2bc;
      --farm-sheet-well: #ecd4a4;
      --farm-sheet-border: #cfa66b;
      --farm-ink-title: #4a240d;
      --farm-ink-body: #633416;
      --farm-crimson-top: #c92a22;
      --farm-crimson-mid: #a61919;
      --farm-crimson-bot: #7a1414;
      --farm-fire-core: #fff6a6;
      --farm-fire-mid: #ff851b;
      --farm-fire-deep: #9c2206;
      --farm-shadow-deep: rgba(34, 16, 5, 0.52);

      --target-size: 36px;
    }

    @media (pointer: coarse) {
      :root { --target-size: 44px; }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Be Vietnam Pro', 'Be Vietnam Pro Fallback', system-ui, -apple-system, sans-serif;
      color: var(--hs-ink);
      background-color: var(--hs-wood);
      overflow-wrap: break-word;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 3px solid var(--hs-gold);
      outline-offset: 2px;
    }

    /* Fullscreen Hang Sóc Parlor Frame */
    .hs-bb-shell {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      padding:
        max(6px, env(safe-area-inset-top, 0px))
        max(10px, env(safe-area-inset-right, 0px))
        max(6px, env(safe-area-inset-bottom, 0px))
        max(10px, env(safe-area-inset-left, 0px));
      gap: 6px;
      background:
        linear-gradient(180deg, rgba(58, 28, 10, 0.34) 0%, rgba(36, 17, 7, 0.54) 100%),
        url('../paintings/burrow_parlor_bg.webp') center center / cover no-repeat;
      box-shadow: inset 0 0 0 3px var(--farm-brass-bright);
      overflow: hidden;
    }

    /* Top Bar — exact Hang Sóc Forest/Wood + Brass Header */
    .hs-bb-header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 13px;
      background: linear-gradient(180deg, var(--hs-forest-2) 0%, var(--hs-forest) 100%);
      border: 2px solid var(--farm-brass-bright);
      box-shadow: 0 3px 0 var(--hs-wood), 0 6px 16px var(--farm-shadow-deep);
      color: var(--hs-cream);
    }

    .hs-bb-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-inline-size: 0;
    }

    .hs-bb-brand img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
      flex: none;
    }

    .hs-bb-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-inline-size: 0;
    }

    .hs-bb-title {
      margin: 0;
      font-family: 'Be Vietnam Pro', 'Be Vietnam Pro Fallback', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.15;
      color: var(--hs-cream);
      text-wrap: balance;
      letter-spacing: -0.01em;
    }

    .hs-bb-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--farm-brass-bright);
      line-height: 1.2;
    }

    /* Mode segmented tabs matching HPVN .hs-tabs */
    .hs-bb-modes {
      display: inline-flex;
      align-items: stretch;
      gap: 2px;
      padding: 2px;
      border-radius: 11px;
      border: 1.5px solid var(--hs-brass);
      background: var(--hs-wood);
    }

    .hs-bb-mode-btn {
      min-block-size: var(--target-size);
      min-inline-size: var(--target-size);
      padding: 0 11px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--hs-cream);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.14s ease, color 0.14s ease;
    }

    .hs-bb-mode-btn[aria-selected="true"] {
      background: var(--hs-gold);
      color: var(--hs-ink);
    }

    /* Score / Goal / Action Pills */
    .hs-bb-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hs-bb-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-block-size: 34px;
      padding: 3px 9px;
      border-radius: 10px;
      border: 1.5px solid var(--hs-brass);
      background: linear-gradient(180deg, var(--farm-sheet-top) 0%, var(--farm-sheet-bot) 100%);
      color: var(--hs-ink);
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 0 var(--hs-wood);
    }

    .hs-bb-pill img {
      width: 17px;
      height: 17px;
      object-fit: contain;
    }

    .hs-bb-pill.is-combo {
      background: linear-gradient(180deg, var(--hs-gold-bright) 0%, var(--hs-gold) 100%);
      border-color: var(--farm-brass-dark);
      color: var(--farm-ink-title);
      transition: transform 0.14s ease;
    }

    .hs-bb-pill.is-combo.pop {
      transform: scale(1.1);
    }

    .hs-bb-pill .lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--hs-ink-soft);
    }

    .hs-bb-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-block-size: var(--target-size);
      min-inline-size: var(--target-size);
      padding: 0 10px;
      border-radius: 10px;
      border: 2px solid var(--farm-brass-bright);
      background: linear-gradient(180deg, var(--farm-wood-warm) 0%, var(--farm-wood-dark) 100%);
      color: var(--hs-cream);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2.5px 0 var(--hs-wood);
      transition: transform 0.12s ease, filter 0.14s ease;
    }

    .hs-bb-icon-btn:active {
      transform: translateY(1.5px);
    }

    .hs-bb-icon-btn.is-gold {
      background: linear-gradient(180deg, var(--hs-gold-bright) 0%, var(--hs-gold) 65%, var(--hs-gold-deep) 100%);
      border-color: var(--hs-wood);
      color: var(--farm-ink-title);
    }

    /* Stage Progress & Goal Bar (exact Hang Sóc Parchment Ribbon) */
    .hs-bb-goalbar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 11px;
      background: linear-gradient(180deg, var(--hs-paper) 0%, var(--hs-paper-2) 100%);
      border: 2px solid var(--hs-brass);
      box-shadow: 0 2.5px 0 var(--hs-wood);
      font-variant-numeric: tabular-nums;
    }

    .hs-bb-goal-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-inline-size: 0;
      flex: 1 1 auto;
    }

    .hs-bb-stage-badge {
      flex: none;
      padding: 3px 9px;
      border-radius: 8px;
      background: var(--hs-wood);
      color: var(--farm-brass-bright);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .hs-bb-progress-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 1 1 130px;
      min-inline-size: 80px;
      max-inline-size: 290px;
    }

    .hs-bb-progress-track {
      position: relative;
      flex: 1 1 auto;
      height: 13px;
      border-radius: 999px;
      background: rgba(56, 27, 12, 0.22);
      border: 1.5px solid var(--hs-brass);
      overflow: hidden;
      box-shadow: inset 0 2px 3px rgba(56, 27, 12, 0.28);
    }

    .hs-bb-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--farm-fire-mid) 0%, var(--hs-gold) 65%, var(--farm-fire-core) 100%);
      transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .hs-bb-progress-txt {
      font-size: 12px;
      font-weight: 800;
      color: var(--hs-ink);
      white-space: nowrap;
    }

    .hs-bb-goal-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .hs-bb-goal-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 8px;
      background: rgba(176, 125, 67, 0.16);
      border: 1px solid rgba(176, 125, 67, 0.45);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--hs-ink);
      white-space: nowrap;
    }

    .hs-bb-goal-chip.is-done {
      background: var(--hs-ok-bg);
      border-color: var(--hs-ok);
      color: var(--hs-ok);
    }

    .hs-bb-goal-chip img {
      width: 15px;
      height: 15px;
      object-fit: contain;
    }

    /* Gravity Toggle Pill */
    .hs-bb-gravity-toggle {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-block-size: var(--target-size);
      padding: 2px 10px;
      border-radius: 999px;
      border: 1.5px solid var(--hs-brass);
      background: var(--farm-sheet-top);
      color: var(--hs-ink);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .hs-bb-gravity-toggle[aria-pressed="true"] {
      background: var(--hs-ok-bg);
      border-color: var(--hs-ok);
      color: var(--hs-ok);
    }

    /* Main Arena Container */
    .hs-bb-stage-area {
      flex: 1 1 0;
      min-block-size: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 236px;
      gap: 10px;
      align-items: stretch;
      max-inline-size: 1360px;
      inline-size: 100%;
      margin: 0 auto;
    }

    /* Left: Carved Wood & Brass 8x8 Canvas Arena */
    .hs-bb-board-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-block-size: 0;
      min-inline-size: 0;
    }

    .hs-bb-board-frame {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--farm-wood-warm) 0%, var(--farm-wood-mid) 52%, var(--farm-wood-dark) 100%);
      border: 2.5px solid var(--farm-brass-bright);
      box-shadow:
        0 5px 0 var(--hs-wood),
        0 14px 32px var(--farm-shadow-deep),
        inset 0 2px 0 rgba(255, 246, 220, 0.35);
    }

    .hs-bb-board-frame.hammer-armed {
      border-color: var(--farm-fire-mid);
      box-shadow:
        0 5px 0 var(--hs-wood),
        0 0 0 4px rgba(255, 133, 27, 0.55),
        0 14px 32px var(--farm-shadow-deep);
    }

    #boardCanvas {
      display: block;
      border-radius: 12px;
      touch-action: none;
      cursor: pointer;
    }

    #boardCanvas.is-hammer {
      cursor: crosshair;
    }

    /* Right Panel: 3-Piece Wood Tray + Rotate + Boosters */
    .hs-bb-dock {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-block-size: 0;
      padding: 8px;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--hs-paper) 0%, var(--hs-paper-2) 100%);
      border: 2.5px solid var(--hs-brass);
      box-shadow: 0 5px 0 var(--hs-wood), 0 10px 24px var(--farm-shadow-deep);
    }

    .hs-bb-dock-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .hs-bb-dock-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--farm-ink-title);
      line-height: 1.2;
    }

    .hs-bb-rotate-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-block-size: var(--target-size);
      padding: 0 10px;
      border-radius: 10px;
      border: 2px solid var(--farm-brass-dark);
      background: linear-gradient(180deg, var(--hs-gold-bright) 0%, var(--hs-gold) 100%);
      color: var(--farm-ink-title);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2.5px 0 var(--hs-wood);
      white-space: nowrap;
    }

    .hs-bb-rotate-btn:active {
      transform: translateY(1.5px);
    }

    .hs-bb-tray {
      flex: 1 1 0;
      min-block-size: 0;
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .hs-bb-slot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-block-size: 0;
      min-inline-size: 0;
      border-radius: 13px;
      background: linear-gradient(180deg, var(--farm-wood-dark) 0%, var(--farm-wood-well) 100%);
      border: 2px solid var(--hs-brass);
      box-shadow: inset 0 3px 8px rgba(18, 8, 3, 0.55);
      cursor: grab;
      touch-action: none;
      transition: border-color 0.14s ease, opacity 0.16s ease;
    }

    .hs-bb-slot:active {
      cursor: grabbing;
    }

    .hs-bb-slot.is-selected {
      border-color: var(--hs-gold);
      box-shadow: inset 0 3px 8px rgba(18, 8, 3, 0.45), 0 0 0 2.5px rgba(245, 179, 1, 0.52);
    }

    .hs-bb-slot.is-dragging {
      opacity: 0.25;
    }

    .hs-bb-slot.is-empty {
      opacity: 0.34;
      cursor: default;
    }

    .hs-bb-slot.is-blocked {
      border-color: var(--hs-bad);
      opacity: 0.72;
    }

    .hs-bb-slot-key {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 10px;
      font-weight: 800;
      color: rgba(244, 198, 104, 0.92);
      pointer-events: none;
    }

    .hs-bb-slot-badge {
      position: absolute;
      top: 4px;
      right: 5px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1px 5px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.25;
      pointer-events: none;
    }

    .hs-bb-slot.needs-rotate .hs-bb-slot-badge {
      display: inline-flex;
      background: var(--hs-gold);
      color: var(--farm-ink-title);
    }

    .hs-bb-slot.is-blocked .hs-bb-slot-badge {
      display: inline-flex;
      background: var(--farm-crimson-mid);
      color: var(--hs-cream);
    }

    @media (pointer: coarse) {
      .hs-bb-slot-key { display: none; }
    }

    .hs-bb-slot canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 11px;
      pointer-events: none;
    }

    /* Footer stack inside Dock (Desktop vertical, Mobile horizontal) */
    .hs-bb-dock-foot {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Fixed-height Unified Dragon Rage Gauge + CTA Button (ZERO Layout Shift!) */
    .hs-bb-rage-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      min-block-size: 44px;
      padding: 0 11px;
      border-radius: 11px;
      border: 2px solid var(--hs-brass);
      background: var(--farm-wood-well);
      color: var(--hs-cream);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      overflow: hidden;
      cursor: default;
      box-shadow: inset 0 2px 5px rgba(18, 8, 3, 0.55);
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .hs-bb-rage-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, var(--farm-crimson-bot) 0%, var(--farm-crimson-top) 55%, var(--farm-fire-mid) 100%);
      transition: width 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .hs-bb-rage-label,
    .hs-bb-rage-pct {
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 2px rgba(28, 12, 4, 0.9);
      white-space: nowrap;
    }

    .hs-bb-rage-btn.is-ready {
      cursor: pointer;
      border-color: var(--farm-fire-core);
      box-shadow: 0 3px 0 var(--hs-wood), 0 0 14px rgba(255, 133, 27, 0.65);
      animation: ragePulse 1s ease-in-out infinite;
    }

    .hs-bb-rage-btn.is-ready .hs-bb-rage-fill {
      width: 100% !important;
      background: linear-gradient(180deg, var(--farm-crimson-top) 0%, var(--farm-crimson-mid) 60%, var(--farm-crimson-bot) 100%);
    }

    .hs-bb-rage-btn.is-ready .hs-bb-rage-pct {
      display: none;
    }

    .hs-bb-rage-btn.is-ready .hs-bb-rage-label {
      width: 100%;
      text-align: center;
      letter-spacing: 0.01em;
    }

    @keyframes ragePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }

    /* Power-Up Spells Row */
    .hs-bb-spells {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      flex: none;
    }

    .hs-bb-spell-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-block-size: 46px;
      padding: 5px 7px;
      border-radius: 11px;
      border: 2px solid var(--farm-brass-bright);
      background: linear-gradient(180deg, var(--farm-wood-warm) 0%, var(--farm-wood-dark) 100%);
      color: var(--hs-cream);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--hs-wood);
      transition: transform 0.12s ease, filter 0.14s ease, border-color 0.14s ease;
    }

    .hs-bb-spell-btn:active {
      transform: translateY(1.5px);
    }

    .hs-bb-spell-btn img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex: none;
    }

    .hs-bb-spell-btn .spell-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.15;
    }

    .hs-bb-spell-btn .spell-qty {
      font-size: 10.5px;
      color: var(--farm-brass-bright);
      font-weight: 700;
    }

    .hs-bb-spell-btn.is-armed {
      background: linear-gradient(180deg, var(--farm-crimson-top) 0%, var(--farm-crimson-bot) 100%);
      border-color: var(--farm-fire-core);
      box-shadow: 0 0 0 3px rgba(255, 133, 27, 0.55), 0 3px 0 var(--hs-wood);
      text-shadow: 0 1px 2px rgba(28, 12, 4, 0.85);
    }

    .hs-bb-spell-btn.is-hint {
      box-shadow: 0 0 0 3px rgba(245, 179, 1, 0.7), 0 3px 0 var(--hs-wood);
    }

    .hs-bb-spell-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.35);
    }

    @media (prefers-reduced-motion: reduce) {

    'use strict';

    // =========================================================================

    // =========================================================================
    const GRID = 8;
    const MAX_STAGE = 777;
    const ENDLESS_MILESTONE_STEP = 1500;
    const URL_PARAMS = new URLSearchParams(location.search);
    const IS_EMBED = URL_PARAMS.get('embed') === '1';
    const EMBED_TOKEN = URL_PARAMS.get('token') || '';
    const BONUS_CHANNEL = 'hs-bonus-arcade';
    const GAME_ID = 'block_blast';
    let REDUCED_MOTION = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ?? false;
    if (IS_EMBED) {
      document.body.classList.add('is-embed');
    }

    const STORAGE_KEYS = {
      bestStage: 'hangsoc_preview_bb_best_stage_v2',
      bestEndless: 'hangsoc_preview_bb_best_endless_v2',
      unlockedStage: 'hangsoc_preview_bb_stage_v2',
      muted: 'hangsoc_preview_bb_muted_v2',
    };

    const embedMemoryStore = new Map();

    function safeGet(key, fallback = '') {
      if (IS_EMBED) {
        return embedMemoryStore.has(key) ? embedMemoryStore.get(key) : fallback;
      }
      try {
        const val = localStorage.getItem(key);
        return val === null ? fallback : val;
      } catch {
        return fallback;
      }
    }

    function safeSet(key, val) {
      if (IS_EMBED) {
        embedMemoryStore.set(key, String(val));
        return;
      }
      try {
        localStorage.setItem(key, String(val));
      } catch {}
    }

    function postToParent(type, extra = {}) {
      if (!window.parent || window.parent === window) return;
      try {
        window.parent.postMessage({
          channel: BONUS_CHANNEL,
          type,
          gameId: GAME_ID,
          token: EMBED_TOKEN,
          ...extra,
        }, '*');
      } catch {}
    }

    // 5 Hogwarts House Jewel Colors tuned directly to Hang Sóc warm palette
    const GEM_STYLES = [
      { id: 'ruby',     name: 'Hồng Ngọc',  top: '#ff7066', mid: '#e03e36', bot: '#99140a' },
      { id: 'emerald',  name: 'Lục Bảo',    top: '#9df043', mid: '#4ab818', bot: '#226908' },
      { id: 'sapphire', name: 'Lam Ngọc',   top: '#7ee2ff', mid: '#2e8de0', bot: '#17519c' },
      { id: 'topaz',    name: 'Hoàng Ngọc', top: '#fff08a', mid: '#f5b301', bot: '#b46900' },
      { id: 'amethyst', name: 'Thạch Anh',  top: '#e28fff', mid: '#a840dc', bot: '#641894' },
    ];

    // Load only the real Hang Sóc .webp sprites rendered on Canvas (zero unused fetches)
    const SPRITE_URLS = {
      bomb: '../sprites/m3_sp_bomb.webp',
      crate: '../sprites/m3_obs_box_1.webp',
    };
    const SPRITES = {};
    for (const [k, url] of Object.entries(SPRITE_URLS)) {
      const img = new Image();
      img.onload = () => {
        if (typeof renderTrayCanvases === 'function' && state?.tray) {
          renderTrayCanvases();
        }
      };
      img.src = url;
      SPRITES[k] = img;
    }

    // Classic Block Blast + Tetris piece templates
    const SHAPES = [
      { cells: [[0,0]], weight: 4 },
      { cells: [[0,0],[0,1]], weight: 7 },
      { cells: [[0,0],[0,1],[0,2]], weight: 8 },
      { cells: [[0,0],[0,1],[1,0]], weight: 9 },
      { cells: [[0,0],[0,1],[0,2],[0,3]], weight: 8 },
      { cells: [[0,0],[0,1],[1,0],[1,1]], weight: 10 },
      { cells: [[0,0],[0,1],[0,2],[1,1]], weight: 10 },
      { cells: [[0,0],[1,0],[2,0],[2,1]], weight: 9 },
      { cells: [[0,1],[1,1],[2,1],[2,0]], weight: 9 },
      { cells: [[0,0],[0,1],[1,1],[1,2]], weight: 7 },
      { cells: [[0,1],[0,2],[1,0],[1,1]], weight: 7 },
      { cells: [[0,0],[0,1],[0,2],[1,0],[2,0]], weight: 5 },
      { cells: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], weight: 4 },
      { cells: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], weight: 2 },
    ];
    const SHAPES_ASC = [...SHAPES].sort((a, b) => a.cells.length - b.cells.length);

    // =========================================================================
    // 2. PROCEDURAL WEB AUDIO SYNTH (Compressor-Protected + Cached Noise)
    // =========================================================================
    let audioCtx = null;
    let masterOut = null;
    let cachedNoiseBuf = null;
    let soundEnabled = safeGet(STORAGE_KEYS.muted, '0') !== '1';

    function ensureAudio() {
      if (!soundEnabled) return null;
      if (!audioCtx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
          const comp = audioCtx.createDynamicsCompressor();
          comp.threshold.value = -12;
          comp.knee.value = 18;
          comp.ratio.value = 6;
          comp.connect(audioCtx.destination);
          masterOut = comp;

          const len = Math.floor(audioCtx.sampleRate * 0.34);
          cachedNoiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const data = cachedNoiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.8);
          }
        } catch {
          return null;
        }
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playPlaceSfx() {
      const ctx = ensureAudio();
      if (!ctx || !masterOut) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.07);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain).connect(masterOut);
      osc.start(now);
      osc.stop(now + 0.09);
    }

    function playInvalidSfx() {
      const ctx = ensureAudio();
      if (!ctx || !masterOut) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(92, now + 0.08);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain).connect(masterOut);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    function playRotateSfx() {
      const ctx = ensureAudio();
      if (!ctx || !masterOut) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.06);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.connect(gain).connect(masterOut);
      osc.start(now);
      osc.stop(now + 0.08);
    }

    function playBlastSfx(combo = 1, isMega = false) {
      const ctx = ensureAudio();
      if (!ctx || !masterOut) return;
      const now = ctx.currentTime;

      const sub = ctx.createOscillator();
      const subGain = ctx.createGain();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(isMega ? 155 : 130, now);
      sub.frequency.exponentialRampToValueAtTime(34, now + (isMega ? 0.34 : 0.22));
      subGain.gain.setValueAtTime(isMega ? 0.4 : 0.28, now);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + (isMega ? 0.36 : 0.24));
      sub.connect(subGain).connect(masterOut);
      sub.start(now);
      sub.stop(now + 0.38);

      if (cachedNoiseBuf) {
        const noise = ctx.createBufferSource();
        noise.buffer = cachedNoiseBuf;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(isMega ? 720 : 960, now);
        filter.Q.value = 1.1;
        const nGain = ctx.createGain();
        const dur = isMega ? 0.32 : 0.18;
        nGain.gain.setValueAtTime(isMega ? 0.3 : 0.18, now);
        nGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        noise.connect(filter).connect(nGain).connect(masterOut);
        noise.start(now);
        noise.stop(now + dur + 0.02);
      }

      const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5];
      const baseIdx = Math.min(scale.length - 2, Math.max(0, combo - 1));
      [scale[baseIdx], scale[Math.min(scale.length - 1, baseIdx + 2)]].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        const t = now + idx * 0.055;
        osc.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
        osc.connect(g).connect(masterOut);
        osc.start(t);
        osc.stop(t + 0.26);
      });
    }

    function playWinFanfare() {
      const ctx = ensureAudio();
      if (!ctx || !masterOut) return;
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        const t = now + i * 0.09;
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.18, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
        osc.connect(g).connect(masterOut);
        osc.start(t);
        osc.stop(t + 0.38);
      });
    }

    function playLoseSfx() {
      const ctx = ensureAudio();
      if (!ctx || !masterOut) return;
      const now = ctx.currentTime;
      [349.23, 311.13, 261.63].forEach((f, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sawtooth';
        const t = now + i * 0.11;
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.1, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
        osc.connect(g).connect(masterOut);
        osc.start(t);
        osc.stop(t + 0.28);
      });
    }

    // =========================================================================
    // 3. GAME STATE & PROCEDURAL STAGE GENERATOR (1–777)
    // =========================================================================
    const initialUnlockedStage = Math.min(MAX_STAGE, Math.max(1, Number(safeGet(STORAGE_KEYS.unlockedStage, '1')) || 1));
    const state = {
      mode: 'stage',
      stage: initialUnlockedStage,
      unlockedStage: initialUnlockedStage,
      gravityEnabled: true,
      grid: createEmptyGrid(),
      tray: [null, null, null],
      selectedSlot: 0,
      score: 0,
      bestStage: Math.max(0, Number(safeGet(STORAGE_KEYS.bestStage, '0')) || 0),
      bestEndless: Math.max(0, Number(safeGet(STORAGE_KEYS.bestEndless, '0')) || 0),
      bestComboAllTime: 0,
      endlessMilestoneTier: 0,
      combo: 0,
      maxCombo: 1,
      biggestBlast: 0,
      movesCount: 0,
      movesSinceSpawn: 0,
      rage: 25,
      hammerQty: 2,
      shuffleQty: 3,
      hammerArmed: false,
      stageGoalScore: 1500,
      stageGoalBombs: 1,
      stageBombsCleared: 0,
      stageGoalCrates: 2,
      stageCratesCleared: 0,
      status: 'playing',
      // Juice & animation pools
      hitStopTimer: 0,
      shakeTime: 0,
      shakeMag: 0,
      flashAlpha: 0,
      beams: [],
      particles: [],
      shockwaves: [],
      floaters: [],
      // Pointer, drag & hover state
      drag: null,
      hoverCell: null, // { r, c } on board for Hammer reticle & desktop click-place preview
      cascadePending: null,
      toastTimer: 0,
      toastText: '',
    };

    let runSeq = 0;
    let suppressDialogCloseAction = false;
    let lastReportedBestScore = Math.max(state.bestStage, state.bestEndless);
    let lastReportedBestCombo = 0;
    let lastReportedUnlockedStage = state.unlockedStage;

    function emitScoreSync(force = false) {
      const bestScore = Math.max(state.bestStage, state.bestEndless);
      const bestCombo = Math.max(state.bestComboAllTime || 0, state.maxCombo || 0);
      const unlockedStage = state.unlockedStage;
      if (
        !force &&
        bestScore <= lastReportedBestScore &&
        bestCombo <= lastReportedBestCombo &&
        unlockedStage <= lastReportedUnlockedStage
      ) {
        return;
      }
      lastReportedBestScore = Math.max(lastReportedBestScore, bestScore);
      lastReportedBestCombo = Math.max(lastReportedBestCombo, bestCombo);
      lastReportedUnlockedStage = Math.max(lastReportedUnlockedStage, unlockedStage);
      postToParent('score', {
        bestScore,
        bestCombo,
        unlockedStage,
      });
    }

    function getCurrentBest() {
      return state.mode === 'stage' ? state.bestStage : state.bestEndless;
    }

    function updateBestScore() {
      let improved = false;
      if (state.mode === 'stage') {
        if (state.score > state.bestStage) {
          state.bestStage = state.score;
          safeSet(STORAGE_KEYS.bestStage, state.bestStage);
          improved = true;
        }
      } else if (state.score > state.bestEndless) {
        state.bestEndless = state.score;
        safeSet(STORAGE_KEYS.bestEndless, state.bestEndless);
        improved = true;
      }
      if (improved) {
        emitScoreSync();
      }
    }

    function isDragonRageReady() {
      return state.rage >= 100 && state.status === 'playing';
    }

    function createEmptyGrid() {
      return Array.from({ length: GRID }, () => Array(GRID).fill(null));
    }

    function normalizeCells(cells) {
      let minR = Infinity, minC = Infinity;
      for (const [r, c] of cells) {
        if (r < minR) minR = r;
        if (c < minC) minC = c;
      }
      return cells.map(([r, c]) => [r - minR, c - minC]);
    }

    function rotateCellsCW(cells) {
      return normalizeCells(cells.map(([r, c]) => [c, -r]));
    }

    function getShapeBounds(cells) {
      let maxR = 0, maxC = 0;
      for (const [r, c] of cells) {
        if (r > maxR) maxR = r;
        if (c > maxC) maxC = c;
      }
      return { rows: maxR + 1, cols: maxC + 1 };
    }

    function pickWeightedShape(preferSmall = false) {
      const pool = preferSmall ? SHAPES.filter((s) => s.cells.length <= 4) : SHAPES;
      const totalW = pool.reduce((sum, s) => sum + s.weight, 0);
      let roll = Math.random() * totalW;
      for (const s of pool) {
        roll -= s.weight;
        if (roll <= 0) return s.cells.map(([r, c]) => [r, c]);
      }
      return pool[0].cells.map(([r, c]) => [r, c]);
    }

    function makePiece(preferSmall = false, forceSpecial = null) {
      let cells = pickWeightedShape(preferSmall);
      const turns = Math.floor(Math.random() * 4);
      for (let i = 0; i < turns; i++) cells = rotateCellsCW(cells);
      const colorIdx = Math.floor(Math.random() * GEM_STYLES.length);
      let special = forceSpecial;
      if (!special) {
        const r = Math.random();
        if (r < 0.14) special = 'bomb';
        else if (r < 0.24) special = 'lightning';
      }
      const specialCellIdx = special ? Math.floor(Math.random() * cells.length) : -1;
      return { cells, colorIdx, special, specialCellIdx };
    }

    function canPlacePieceAt(piece, baseR, baseC) {
      if (!piece) return false;
      for (const [dr, dc] of piece.cells) {
        const r = baseR + dr;
        const c = baseC + dc;
        if (r < 0 || r >= GRID || c < 0 || c >= GRID) return false;
        if (state.grid[r][c] !== null) return false;
      }
      return true;
    }

    function getPieceFitStatus(piece) {
      if (!piece) return 'none';
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          if (canPlacePieceAt(piece, r, c)) return 'direct';
        }
      }
      let testCells = piece.cells;
      for (let t = 1; t < 4; t++) {
        testCells = rotateCellsCW(testCells);
        const dummy = { ...piece, cells: testCells };
        for (let r = 0; r < GRID; r++) {
          for (let c = 0; c < GRID; c++) {
            if (canPlacePieceAt(dummy, r, c)) return 'rotated';
          }
        }
      }
      return 'blocked';
    }

    function canPieceFitAnywhere(piece, allowRotation = true) {
      const status = getPieceFitStatus(piece);
      return allowRotation ? status === 'direct' || status === 'rotated' : status === 'direct';
    }

    function countActiveBombsOnBoardOrTray() {
      let count = 0;
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          const sp = state.grid[r][c]?.special;
          if (sp === 'bomb' || sp === 'countdown') count++;
        }
      }
      for (const p of state.tray) {
        if (p && p.special === 'bomb') count++;
      }
      return count;
    }

    function refillTray(guaranteedPlayable = true) {
      let filled = 0;
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          if (state.grid[r][c]) filled++;
        }
      }
      const crowded = filled > 40;
      const needStageBomb =
        state.mode === 'stage' &&
        state.stageBombsCleared < state.stageGoalBombs &&
        countActiveBombsOnBoardOrTray() === 0;

      for (let i = 0; i < 3; i++) {
        const forceBomb = i === 0 && (state.movesCount === 0 || needStageBomb);
        state.tray[i] = makePiece(crowded, forceBomb ? 'bomb' : null);
      }

      if (guaranteedPlayable && !state.tray.some((p) => canPieceFitAnywhere(p, true))) {
        let found = false;
        for (let attempt = 0; attempt < 25; attempt++) {
          const candidate = makePiece(true, needStageBomb ? 'bomb' : null);
          if (canPieceFitAnywhere(candidate, true)) {
            state.tray[0] = candidate;
            found = true;
            break;
          }
        }
        // Deterministic fallback: iterate smallest-to-largest shapes so guaranteedPlayable never fails while any hole exists
        if (!found) {
          outer: for (const tpl of SHAPES_ASC) {
            let cells = tpl.cells.map(([r, c]) => [r, c]);
            for (let turn = 0; turn < 4; turn++) {
              const cand = {
                cells,
                colorIdx: Math.floor(Math.random() * GEM_STYLES.length),
                special: needStageBomb ? 'bomb' : null,
                specialCellIdx: needStageBomb ? 0 : -1,
              };
              if (canPieceFitAnywhere(cand, false)) {
                state.tray[0] = cand;
                break outer;
              }
              cells = rotateCellsCW(cells);
            }
          }
        }
      }

      state.selectedSlot = state.tray.findIndex((p) => p !== null);
      if (state.selectedSlot < 0) state.selectedSlot = 0;
    }

    // Distinct stage patterns cycled across stages 1–777
    const STAGE_PATTERNS = [
      // Pattern 0: Hang Sóc Hearth (classic bottom burst with center alley)
      [
        [5,0],[5,1],[5,2],[5,4],[5,5],[5,6],
        [6,1],[6,2],[6,5],[6,6],
        [7,0],[7,1],[7,2],[7,4],[7,5],[7,7],
      ],
      // Pattern 1: Twin Towers (left & right pillars inviting horizontal cross-clears)
      [
        [4,0],[4,1],[4,6],[4,7],
        [5,0],[5,1],[5,2],[5,5],[5,6],[5,7],
        [6,0],[6,1],[6,3],[6,4],[6,6],[6,7],
        [7,0],[7,2],[7,5],[7,7],
      ],
      // Pattern 2: Cauldron Arch (center cluster + wide base)
      [
        [4,2],[4,3],[4,4],[4,5],
        [5,1],[5,2],[5,5],[5,6],
        [6,0],[6,1],[6,2],[6,5],[6,6],[6,7],
        [7,1],[7,3],[7,4],[7,6],
      ],
      // Pattern 3: Diagonal Steps (great for Tetris gravity cascade!)
      [
        [3,0],[3,1],[4,1],[4,2],[4,3],
        [5,2],[5,3],[5,4],[5,5],
        [6,0],[6,3],[6,4],[6,5],[6,6],
        [7,0],[7,1],[7,4],[7,5],[7,6],[7,7],
      ],
    ];

    function setupStage(stageNum) {
      runSeq++;
      state.stage = Math.min(MAX_STAGE, Math.max(1, stageNum));
      state.grid = createEmptyGrid();
      state.score = 0;
      state.endlessMilestoneTier = 0;
      state.combo = 0;
      state.maxCombo = 1;
      state.biggestBlast = 0;
      state.movesCount = 0;
      state.movesSinceSpawn = 0;
      state.rage = 25;
      state.hammerQty = 2;
      state.shuffleQty = 3;
      state.hammerArmed = false;
      state.hoverCell = null;
      state.drag = null;
      state.status = 'playing';
      state.beams = [];
      state.particles = [];
      state.shockwaves = [];
      state.floaters = [];
      state.cascadePending = null;
      state.stageBombsCleared = 0;
      state.stageCratesCleared = 0;

      if (state.mode === 'stage') {
        state.stageGoalScore = 1500 + (state.stage - 1) * 750;
        state.stageGoalBombs = Math.min(4, 1 + Math.floor(state.stage / 2));
        state.stageGoalCrates = state.stage >= 2 ? Math.min(8, 2 + state.stage) : 2;

        const pat = STAGE_PATTERNS[(state.stage - 1) % STAGE_PATTERNS.length];
        for (const [r, c] of pat) {
          state.grid[r][c] = {
            colorIdx: (r + c + state.stage) % GEM_STYLES.length,
            special: null,
            dropY: 0,
            scale: 1,
          };
        }
        // Seed a Fire Bomb right in row 5 so turn 1 can trigger a huge chain!
        state.grid[5][2] = { colorIdx: 0, special: 'bomb', dropY: 0, scale: 1 };
        // Seed a Countdown Cross-Bomb for Tetris urgency
        state.grid[4][3] = { colorIdx: 0, special: 'countdown', timer: 5, dropY: 0, scale: 1 };
        if (state.stage >= 3) {
          state.grid[5][5] = { colorIdx: 2, special: 'lightning', dropY: 0, scale: 1 };
        }
        // Seed crates matching stageGoalCrates
        const crateSpots = [[6,0],[6,7],[4,1],[4,6],[3,2],[3,5],[7,3],[7,6]];
        for (let i = 0; i < Math.min(state.stageGoalCrates, crateSpots.length); i++) {
          const [r, c] = crateSpots[i];
          state.grid[r][c] = { colorIdx: 3, special: 'crate', dropY: 0, scale: 1 };
        }
      } else {
        state.stageGoalScore = 0;
        state.stageGoalBombs = 0;
        state.stageGoalCrates = 0;
        state.grid[6][3] = { colorIdx: 0, special: 'bomb', dropY: 0, scale: 1 };
        state.grid[6][4] = { colorIdx: 3, special: null, dropY: 0, scale: 1 };
        state.grid[7][3] = { colorIdx: 2, special: 'lightning', dropY: 0, scale: 1 };
        state.grid[7][4] = { colorIdx: 1, special: null, dropY: 0, scale: 1 };
      }

      refillTray(true);
      syncHudDOM();
      renderTrayCanvases();
    }

    // =========================================================================
    // 4. EXPLOSIVE LINE CLEARS, CHAIN BOMBS & TETRIS GRAVITY CASCADE
    // =========================================================================
    const boardCanvas = document.getElementById('boardCanvas');
    const bctx = boardCanvas.getContext('2d');
    const ghostCanvas = document.getElementById('dragGhostCanvas');
    const gctx = ghostCanvas.getContext('2d');
    const boardBgCanvas = document.createElement('canvas');
    let dpr = Math.min(2, window.devicePixelRatio || 1);
    let boardCssSize = 480;
    let ghostVisible = false;

    function getBoardMetrics() {
      const size = boardCssSize;
      const pad = Math.max(4, Math.round(size * 0.015));
      const cell = (size - pad * 2) / GRID;
      return { size, pad, cell };
    }

    function cellCenter(r, c) {
      const { pad, cell } = getBoardMetrics();
      return {
        x: pad + (c + 0.5) * cell,
        y: pad + (r + 0.5) * cell,
      };
    }

    function announceSR(msg) {
      const el = document.getElementById('srLive');
      if (el) el.textContent = msg;
    }

    function showToast(msg, durationSec = 1.8) {
      state.toastText = msg;
      state.toastTimer = durationSec;
      syncBannerDOM();
      announceSR(msg);
    }

    function spawnExplosionFx(r, c, colorHex, count = 14, mega = false) {
      const { x, y } = cellCenter(r, c);
      const n = REDUCED_MOTION ? Math.min(4, count) : count;
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = (mega ? 140 : 85) + Math.random() * (mega ? 260 : 165);
        state.particles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - (mega ? 90 : 45),
          size: (mega ? 5 : 3.5) + Math.random() * (mega ? 7 : 5),
          color: Math.random() < 0.35 ? '#fff6a6' : Math.random() < 0.65 ? '#ff851b' : colorHex,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 14,
          age: 0,
          maxAge: 0.42 + Math.random() * 0.35,
          shape: Math.random() < 0.55 ? 'diamond' : 'spark',
        });
      }
      if (!REDUCED_MOTION) {
        state.shockwaves.push({
          x,
          y,
          maxR: mega ? getBoardMetrics().cell * 2.5 : getBoardMetrics().cell * 1.15,
          age: 0,
          maxAge: mega ? 0.42 : 0.28,
          color: mega ? '#ff851b' : '#f4c668',
        });
      }
    }

    function triggerShake(mag, duration = 0.22) {
      if (REDUCED_MOTION) return;
      state.shakeMag = Math.max(state.shakeMag, mag);
      state.shakeTime = Math.max(state.shakeTime, duration);
    }

    function addFloater(r, c, text, sub = '', color = '#ffe58f', scale = 1) {
      const { x, y } = cellCenter(r, c);
      state.floaters.push({ x, y, text, sub, color, scale, age: 0, maxAge: 1.05 });
    }

    function findFullLines() {
      const fullRows = [];
      const fullCols = [];
      for (let r = 0; r < GRID; r++) {
        let ok = true;
        for (let c = 0; c < GRID; c++) {
          if (!state.grid[r][c]) { ok = false; break; }
        }
        if (ok) fullRows.push(r);
      }
      for (let c = 0; c < GRID; c++) {
        let ok = true;
        for (let r = 0; r < GRID; r++) {
          if (!state.grid[r][c]) { ok = false; break; }
        }
        if (ok) fullCols.push(c);
      }
      return { fullRows, fullCols };
    }

    function previewFullLinesWithPiece(piece, baseR, baseC) {
      const previewRows = [];
      const previewCols = [];
      const placedSet = new Set();
      for (const [dr, dc] of piece.cells) {
        placedSet.add(`${baseR + dr},${baseC + dc}`);
      }
      for (let r = 0; r < GRID; r++) {
        let full = true;
        for (let c = 0; c < GRID; c++) {
          if (!state.grid[r][c] && !placedSet.has(`${r},${c}`)) { full = false; break; }
        }
        if (full) previewRows.push(r);
      }
      for (let c = 0; c < GRID; c++) {
        let full = true;
        for (let r = 0; r < GRID; r++) {
          if (!state.grid[r][c] && !placedSet.has(`${r},${c}`)) { full = false; break; }
        }
        if (full) previewCols.push(c);
      }
      return { previewRows, previewCols };
    }

    function resolveClearsAndExplosions(anchorR, anchorC, isCascade = false, forcedCells = null, opts = {}) {
      const { chargeRage = true, customHeadline = '', customSub = '' } = opts;
      const toClear = new Set();
      const { fullRows, fullCols } = forcedCells ? { fullRows: [], fullCols: [] } : findFullLines();

      if (forcedCells) {
        for (const [r, c] of forcedCells) {
          if (r >= 0 && r < GRID && c >= 0 && c < GRID && state.grid[r][c]) {
            toClear.add(`${r},${c}`);
          }
        }
      } else {
        for (const r of fullRows) {
          state.beams.push({ type: 'row', index: r, age: 0, maxAge: 0.36, color: '#ff851b' });
          for (let c = 0; c < GRID; c++) toClear.add(`${r},${c}`);
        }
        for (const c of fullCols) {
          state.beams.push({ type: 'col', index: c, age: 0, maxAge: 0.36, color: '#f4c668' });
          for (let r = 0; r < GRID; r++) toClear.add(`${r},${c}`);
        }
      }

      if (toClear.size === 0) {
        if (!isCascade) state.combo = 0;
        return 0;
      }

      // Chain-reaction BFS for Bombs, Countdown Cross-Bombs, and Lightning tiles
      const processedSpecials = new Set();
      const queue = Array.from(toClear);
      let chainBombCount = 0;
      let lightningTriggered = 0;

      while (queue.length > 0) {
        const key = queue.shift();
        if (processedSpecials.has(key)) continue;
        const [r, c] = key.split(',').map(Number);
        const cell = state.grid[r]?.[c];
        if (!cell) continue;

        if (cell.special === 'bomb') {
          processedSpecials.add(key);
          chainBombCount++;
          state.stageBombsCleared++;
          spawnExplosionFx(r, c, '#ff851b', 24, true);
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID && state.grid[nr][nc]) {
                const nk = `${nr},${nc}`;
                if (!toClear.has(nk)) {
                  toClear.add(nk);
                  queue.push(nk);
                }
              }
            }
          }
        } else if (cell.special === 'countdown') {
          processedSpecials.add(key);
          chainBombCount += 2;
          state.stageBombsCleared++;
          state.beams.push({ type: 'row', index: r, age: 0, maxAge: 0.44, color: '#e03e36' });
          state.beams.push({ type: 'col', index: c, age: 0, maxAge: 0.44, color: '#fff6a6' });
          spawnExplosionFx(r, c, '#e03e36', 30, true);
          for (let i = 0; i < GRID; i++) {
            if (state.grid[r][i]) {
              const nk = `${r},${i}`;
              if (!toClear.has(nk)) { toClear.add(nk); queue.push(nk); }
            }
            if (state.grid[i][c]) {
              const nk = `${i},${c}`;
              if (!toClear.has(nk)) { toClear.add(nk); queue.push(nk); }
            }
          }
        } else if (cell.special === 'lightning') {
          processedSpecials.add(key);
          lightningTriggered++;
          spawnExplosionFx(r, c, '#7ee2ff', 20, true);
          let bestRow = -1, bestCount = 0;
          for (let rr = 0; rr < GRID; rr++) {
            let cnt = 0;
            for (let cc = 0; cc < GRID; cc++) {
              if (state.grid[rr][cc] && !toClear.has(`${rr},${cc}`)) cnt++;
            }
            if (cnt > bestCount) { bestCount = cnt; bestRow = rr; }
          }
          if (bestRow >= 0) {
            state.beams.push({ type: 'row', index: bestRow, age: 0, maxAge: 0.42, color: '#7ee2ff' });
            for (let cc = 0; cc < GRID; cc++) {
              if (state.grid[bestRow][cc]) {
                const nk = `${bestRow},${cc}`;
                if (!toClear.has(nk)) { toClear.add(nk); queue.push(nk); }
              }
            }
          }
        }
      }

      // Shatter wooden crates directly adjacent to cleared cells
      const adjacentCrates = [];
      for (const key of toClear) {
        const [r, c] = key.split(',').map(Number);
        for (const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]) {
          const nr = r + dr, nc = c + dc;
          const adj = state.grid[nr]?.[nc];
          if (adj && adj.special === 'crate' && !toClear.has(`${nr},${nc}`)) {
            adjacentCrates.push(`${nr},${nc}`);
          }
        }
      }
      for (const ck of adjacentCrates) toClear.add(ck);

      let clearedCount = 0;
      let sumR = 0, sumC = 0;
      for (const key of toClear) {
        const [r, c] = key.split(',').map(Number);
        const cell = state.grid[r][c];
        if (!cell) continue;
        if (cell.special === 'crate') state.stageCratesCleared++;
        const colStyle = GEM_STYLES[cell.colorIdx] || GEM_STYLES[3];
        spawnExplosionFx(r, c, colStyle.mid, toClear.size >= 14 ? 10 : 8, false);
        state.grid[r][c] = null;
        clearedCount++;
        sumR += r;
        sumC += c;
      }

      state.combo = Math.max(1, state.combo + 1);
      if (state.combo > state.maxCombo) state.maxCombo = state.combo;
      if (state.maxCombo > state.bestComboAllTime) {
        state.bestComboAllTime = state.maxCombo;
        emitScoreSync();
      }
      if (clearedCount > state.biggestBlast) state.biggestBlast = clearedCount;

      const lineCount = fullRows.length + fullCols.length;
      const isCross = fullRows.length > 0 && fullCols.length > 0;
      const isMega = isCross || chainBombCount > 0 || lightningTriggered > 0 || clearedCount >= 14 || isCascade;

      const pts = Math.round(
        clearedCount * 22 * (1 + (state.combo - 1) * 0.45) +
        (isCross ? 260 : 0) +
        chainBombCount * 180 +
        lightningTriggered * 140 +
        (isCascade ? 220 : 0)
      );
      state.score += pts;
      updateBestScore();

      // Charge Dragon Rage (disabled during Dragon Rage's own blast so it resets cleanly to 0%!)
      if (chargeRage) {
        const nextRage = state.rage + clearedCount * 2.2 + (isMega ? 12 : 0);
        state.rage = nextRage >= 99.5 ? 100 : Math.min(100, nextRage);
      }

      if (isMega) {
        state.hitStopTimer = 0.036;
        triggerShake(Math.min(11, 4.5 + clearedCount * 0.25), 0.28);
        state.flashAlpha = 0.24;
      } else {
        triggerShake(3.2, 0.16);
      }
      playBlastSfx(state.combo, isMega);

      const centerR = clearedCount > 0 ? sumR / clearedCount : anchorR;
      const centerC = clearedCount > 0 ? sumC / clearedCount : anchorC;
      const headline = customHeadline || (
        isCascade
          ? `SẬP TẦNG ×${state.combo}!`
          : isCross
            ? `CHỮ THẬP NỔ ×${state.combo}!`
            : chainBombCount > 0
              ? `BÙM LIÊN HOÀN ×${state.combo}!`
              : lightningTriggered > 0
                ? `SÉT NỔ HÀNG ×${state.combo}!`
                : lineCount >= 2
                  ? `NỔ KÉP ×${state.combo}!`
                  : state.combo >= 2
                    ? `COMBO ×${state.combo}!`
                    : 'NỔ ĐẸP!'
      );
      const subText = customSub || `+${pts.toLocaleString('vi-VN')}`;
      addFloater(centerR, centerC, headline, subText, isMega ? '#fff6a6' : '#ffe58f', isMega ? 1.15 : 1);
      announceSR(`${headline} ${subText}`);

      // Apply Tetris Gravity Cascade whenever horizontal gaps could exist
      const shouldDrop =
        state.gravityEnabled &&
        (fullRows.length > 0 || chainBombCount > 0 || lightningTriggered > 0 || adjacentCrates.length > 0 || Boolean(forcedCells));
      if (shouldDrop) {
        const droppedAny = applyTetrisGravity();
        if (droppedAny) {
          state.cascadePending = { timer: 0.26, anchorR: centerR, anchorC: centerC, chargeRage };
        }
      }

      return clearedCount;
    }

    function applyTetrisGravity() {
      const { cell } = getBoardMetrics();
      let moved = false;
      for (let c = 0; c < GRID; c++) {
        let writeR = GRID - 1;
        for (let r = GRID - 1; r >= 0; r--) {
          const item = state.grid[r][c];
          if (item) {
            if (writeR !== r) {
              state.grid[writeR][c] = item;
              state.grid[r][c] = null;
              item.dropY = -(writeR - r) * cell;
              moved = true;
            }
            writeR--;
          }
        }
      }
      return moved;
    }

    function tickCountdowns() {
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          const item = state.grid[r][c];
          if (item && item.special === 'countdown') {
            item.timer = (item.timer ?? 4) - 1;
            if (item.timer <= 0) {
              item.special = 'crate';
              delete item.timer;
              spawnExplosionFx(r, c, '#b93822', 12, false);
              addFloater(r, c, 'KHÓA THÙNG!', '', '#fda4af', 0.92);
              triggerShake(4, 0.18);
            }
          }
        }
      }
    }

    function maybeSpawnBonusBomb() {
      const needStageBomb =
        state.mode === 'stage' &&
        state.stageBombsCleared < state.stageGoalBombs &&
        countActiveBombsOnBoardOrTray() === 0;
      if (!needStageBomb && state.movesSinceSpawn < 6) return;

      const emptyTopCols = [];
      for (let c = 0; c < GRID; c++) {
        if (!state.grid[0][c]) emptyTopCols.push(c);
      }
      if (emptyTopCols.length === 0) return;

      state.movesSinceSpawn = 0;
      const col = emptyTopCols[Math.floor(Math.random() * emptyTopCols.length)];
      let landR = 0;
      if (state.gravityEnabled) {
        while (landR + 1 < GRID && !state.grid[landR + 1][col]) landR++;
      }
      const isCountdown = needStageBomb || Math.random() < 0.65;
      state.grid[landR][col] = isCountdown
        ? { colorIdx: 0, special: 'countdown', timer: 5, dropY: -(landR + 1) * getBoardMetrics().cell, scale: 1 }
        : { colorIdx: 0, special: 'bomb', dropY: -(landR + 1) * getBoardMetrics().cell, scale: 1 };

      // If the dropped bomb completed a row or column, immediately schedule cascade clear!
      const { fullRows, fullCols } = findFullLines();
      if (fullRows.length > 0 || fullCols.length > 0) {
        state.cascadePending = { timer: 0.22, anchorR: landR, anchorC: col, chargeRage: true };
      }
    }

    function placePieceOnBoard(slotIdx, baseR, baseC) {
      if (state.status !== 'playing' || state.cascadePending) return false;
      const piece = state.tray[slotIdx];
      if (!piece || !canPlacePieceAt(piece, baseR, baseC)) return false;

      for (let i = 0; i < piece.cells.length; i++) {
        const [dr, dc] = piece.cells[i];
        const r = baseR + dr;
        const c = baseC + dc;
        const isSpec = i === piece.specialCellIdx;
        state.grid[r][c] = {
          colorIdx: piece.colorIdx,
          special: isSpec ? piece.special : null,
          dropY: 0,
          scale: 0.45,
        };
      }

      state.tray[slotIdx] = null;
      state.movesCount++;
      state.movesSinceSpawn++;
      state.score += piece.cells.length * 10;
      updateBestScore();
      playPlaceSfx();

      const cleared = resolveClearsAndExplosions(baseR, baseC, false);
      if (cleared === 0) {
        tickCountdowns();
        maybeSpawnBonusBomb();
      } else if (!state.cascadePending) {
        maybeSpawnBonusBomb();
      }

      if (state.tray.every((p) => p === null)) {
        refillTray(true);
      } else if (!state.tray[state.selectedSlot]) {
        const nextIdx = state.tray.findIndex((p) => p !== null);
        state.selectedSlot = nextIdx >= 0 ? nextIdx : 0;
      }

      if (!state.cascadePending) {
        checkWinOrLoss();
      }
      syncHudDOM();
      renderTrayCanvases();
      return true;
    }

    function checkWinOrLoss() {
      if (state.status !== 'playing') return;
      if (state.mode === 'stage') {
        const scoreOk = state.score >= state.stageGoalScore;
        const bombsOk = state.stageBombsCleared >= state.stageGoalBombs;
        const cratesOk = state.stageCratesCleared >= state.stageGoalCrates;
        if (scoreOk && bombsOk && cratesOk) {
          state.status = 'won';
          const nextStage = Math.min(MAX_STAGE, state.stage + 1);
          if (nextStage > state.unlockedStage) {
            state.unlockedStage = nextStage;
            safeSet(STORAGE_KEYS.unlockedStage, state.unlockedStage);
            emitScoreSync();
          }
          postToParent('victory', {
            stage: state.stage,
            score: state.score,
            combo: state.maxCombo || state.combo || 1,
            isBoss: state.stage % 5 === 0,
            runId: `bb_${state.stage}_${Date.now()}`,
          });
          playWinFanfare();
          openResultDialog(true);
          return;
        }
      } else if (state.mode === 'endless') {
        const reachedTier = Math.floor(state.score / ENDLESS_MILESTONE_STEP);
        while (state.endlessMilestoneTier < reachedTier) {
          state.endlessMilestoneTier++;
          const milestoneStage = state.endlessMilestoneTier;
          postToParent('victory', {
            stage: milestoneStage,
            score: state.score,
            combo: state.maxCombo || state.combo || 1,
            isBoss: milestoneStage % 5 === 0,
            runId: `bb_endless_${runSeq}_m${milestoneStage}_${Date.now()}`,
          });
          showToast(`Vượt mốc ${(milestoneStage * ENDLESS_MILESTONE_STEP).toLocaleString('vi-VN')} điểm! Nhận thưởng Hang Sóc!`, 2.0);
        }
      }
      const remaining = state.tray.filter(Boolean);
      const anyFits = remaining.some((p) => canPieceFitAnywhere(p, true));
      if (!anyFits && state.hammerQty <= 0 && state.shuffleQty <= 0 && !isDragonRageReady()) {
        state.status = 'lost';
        playLoseSfx();
        openResultDialog(false);
      }
    }

    function fireHammerAt(r, c) {
      if (!state.hammerArmed || state.hammerQty <= 0 || state.status !== 'playing' || state.cascadePending) return;
      const targets = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID && state.grid[nr][nc]) {
            targets.push([nr, nc]);
          }
        }
      }
      if (targets.length === 0) {
        playInvalidSfx();
        showToast('Chạm vào vùng có gạch để đập Búa 3×3!');
        return;
      }
      state.hammerQty--;
      state.hammerArmed = false;
      spawnExplosionFx(r, c, '#ff851b', 30, true);
      resolveClearsAndExplosions(r, c, false, targets);
      if (!state.cascadePending) checkWinOrLoss();
      syncHudDOM();
      renderTrayCanvases();
    }

    function triggerDragonRageBlast() {
      if (!isDragonRageReady() || state.cascadePending) return;
      const rowCounts = Array.from({ length: GRID }, (_, r) => ({
        r,
        cnt: state.grid[r].filter(Boolean).length,
      })).sort((a, b) => b.cnt - a.cnt);
      const colCounts = Array.from({ length: GRID }, (_, c) => {
        let cnt = 0;
        for (let r = 0; r < GRID; r++) if (state.grid[r][c]) cnt++;
        return { c, cnt };
      }).sort((a, b) => b.cnt - a.cnt);

      const targets = [];
      const chosenRows = rowCounts.slice(0, 2).filter((x) => x.cnt > 0);
      const chosenCol = colCounts[0]?.cnt > 0 ? colCounts[0].c : -1;
      for (const { r } of chosenRows) {
        for (let c = 0; c < GRID; c++) targets.push([r, c]);
      }
      if (chosenCol >= 0) {
        for (let r = 0; r < GRID; r++) targets.push([r, chosenCol]);
      }

      if (targets.length === 0) {
        playInvalidSfx();
        showToast('Bảng đang trống — đặt thêm gạch rồi hãy kích Hỏa Long!');
        return;
      }

      // Only consume Rage after confirming valid targets; prevent self-recharging
      state.rage = 0;
      state.hammerArmed = false;
      for (const { r } of chosenRows) {
        state.beams.push({ type: 'row', index: r, age: 0, maxAge: 0.52, color: '#ff851b' });
      }
      if (chosenCol >= 0) {
        state.beams.push({ type: 'col', index: chosenCol, age: 0, maxAge: 0.52, color: '#fff6a6' });
      }
      resolveClearsAndExplosions(3.5, 3.5, false, targets, {
        chargeRage: false,
        customHeadline: 'HỎA LONG QUÉT BẢNG!',
        customSub: 'SIÊU NỔ!',
      });
      if (!state.cascadePending) checkWinOrLoss();
      syncHudDOM();
      renderTrayCanvases();
    }

    function spawnConfettiBurst(centerR, centerC, count = 34) {
      const { x, y } = cellCenter(centerR, centerC);
      const palette = ['#ffe484', '#ff851b', '#ff7066', '#9df043', '#7ee2ff', '#e28fff', '#fff6dc'];
      const n = REDUCED_MOTION ? Math.min(8, count) : count;
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 110 + Math.random() * 250;
        state.particles.push({
          x: x + (Math.random() - 0.5) * getBoardMetrics().cell * 4.5,
          y: y + (Math.random() - 0.5) * getBoardMetrics().cell * 1.4,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 120,
          size: 4.5 + Math.random() * 6,
          color: palette[i % palette.length],
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 16,
          age: 0,
          maxAge: 0.58 + Math.random() * 0.42,
          shape: i % 2 === 0 ? 'diamond' : 'spark',
        });
      }
      if (!REDUCED_MOTION) {
        state.shockwaves.push({
          x,
          y,
          maxR: getBoardMetrics().cell * 3.2,
          age: 0,
          maxAge: 0.48,
          color: '#ffe484',
        });
      }
    }

    function makeGuaranteedPlaceablePiece(forceBomb = false) {
      for (let attempt = 0; attempt < 28; attempt++) {
        const cand = makePiece(true, forceBomb ? 'bomb' : null);
        if (canPieceFitAnywhere(cand, true)) {
          return cand;
        }
      }
      for (const tpl of SHAPES_ASC) {
        let cells = tpl.cells.map(([r, c]) => [r, c]);
        for (let turn = 0; turn < 4; turn++) {
          const cand = {
            cells,
            colorIdx: Math.floor(Math.random() * GEM_STYLES.length),
            special: forceBomb ? 'bomb' : null,
            specialCellIdx: forceBomb ? 0 : -1,
          };
          if (canPieceFitAnywhere(cand, false)) {
            return cand;
          }
          cells = rotateCellsCW(cells);
        }
      }
      return makePiece(true, forceBomb ? 'bomb' : null);
    }

    function refillTrayAllPlaceable() {
      const needStageBomb =
        state.mode === 'stage' &&
        state.stageBombsCleared < state.stageGoalBombs &&
        countActiveBombsOnBoardOrTray() === 0;
      for (let i = 0; i < 3; i++) {
        state.tray[i] = makeGuaranteedPlaceablePiece(i === 0 && needStageBomb);
      }
      state.selectedSlot = 0;
    }

    function applyMollyClearRescue() {
      // Revive cleanly if player was on game-over modal
      if (state.status === 'lost') {
        if (resultDialog.open) {
          suppressDialogCloseAction = true;
          resultDialog.close();
        }
        state.status = 'playing';
      }
      if (state.status !== 'playing') {
        postToParent('boost-applied', {
          ok: true,
          boostKind: 'clear_rescue',
          msgVi: 'Bánh Táo Bà Molly đã sẵn sàng cho màn tiếp theo!',
        });
        return;
      }

      state.drag = null;
      state.hammerArmed = false;
      state.cascadePending = null;

      let bestRow = -1;
      let bestRowCnt = 0;
      for (let r = 0; r < GRID; r++) {
        let cnt = 0;
        for (let c = 0; c < GRID; c++) if (state.grid[r][c]) cnt++;
        if (cnt > bestRowCnt) {
          bestRowCnt = cnt;
          bestRow = r;
        }
      }

      let bestCol = -1;
      let bestColCnt = 0;
      if (bestRowCnt === 0) {
        for (let c = 0; c < GRID; c++) {
          let cnt = 0;
          for (let r = 0; r < GRID; r++) if (state.grid[r][c]) cnt++;
          if (cnt > bestColCnt) {
            bestColCnt = cnt;
            bestCol = c;
          }
        }
      }

      const targets = [];
      let fxR = 3.5;
      let fxC = 3.5;
      if (bestRow >= 0 && bestRowCnt > 0) {
        fxR = bestRow;
        state.beams.push({ type: 'row', index: bestRow, age: 0, maxAge: 0.56, color: '#ff851b' });
        for (let c = 0; c < GRID; c++) {
          if (state.grid[bestRow][c]) targets.push([bestRow, c]);
        }
      } else if (bestCol >= 0 && bestColCnt > 0) {
        fxC = bestCol;
        state.beams.push({ type: 'col', index: bestCol, age: 0, maxAge: 0.56, color: '#ffe484' });
        for (let r = 0; r < GRID; r++) {
          if (state.grid[r][bestCol]) targets.push([r, bestCol]);
        }
      }

      if (targets.length > 0) {
        resolveClearsAndExplosions(fxR, fxC, false, targets, {
          chargeRage: true,
          customHeadline: 'BÁNH TÁO BÀ MOLLY!',
          customSub: '+120 ĐIỂM · ĐỔI KHAY!',
        });
        state.score += 120;
        updateBestScore();
      } else {
        state.beams.push({ type: 'row', index: 3, age: 0, maxAge: 0.52, color: '#ffe484' });
        state.score += 150;
        updateBestScore();
        addFloater(3.5, 3.5, 'BÁNH TÁO BÀ MOLLY!', '+150 · ĐỔI KHAY!', '#fff6a6', 1.12);
        playBlastSfx(2, true);
        triggerShake(5, 0.22);
        state.flashAlpha = 0.22;
      }

      spawnConfettiBurst(fxR, fxC, 38);
      refillTrayAllPlaceable();

      const rescueMsg = 'Bánh Táo Bà Molly đã quét sạch 1 hàng & đổi 3 khối mới!';
      if (!IS_EMBED) {
        showToast(rescueMsg, 2.4);
      } else {
        // Suppress duplicate inner DOM toast banner when embedded — parent renders a single toast
        state.toastTimer = 0;
        state.toastText = '';
        syncBannerDOM();
        announceSR(rescueMsg);
      }

      if (!state.cascadePending) {
        checkWinOrLoss();
      }
      syncHudDOM();
      renderTrayCanvases();

      postToParent('boost-applied', {
        ok: true,
        boostKind: 'clear_rescue',
        msgVi: rescueMsg,
      });
    }

    // =========================================================================
    // 5. CANVAS RENDERING (Cached Static Board Well + Crisp 2.5D Hang Sóc Gems)
    // =========================================================================
    function roundRectPath(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function rebuildBoardBackgroundCache() {
      const { size, pad, cell } = getBoardMetrics();
      boardBgCanvas.width = Math.round(size * dpr);
      boardBgCanvas.height = Math.round(size * dpr);
      const ctx = boardBgCanvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, size, size);

      const wellGrad = ctx.createLinearGradient(0, 0, 0, size);
      wellGrad.addColorStop(0, '#492410');
      wellGrad.addColorStop(1, '#311608');
      roundRectPath(ctx, 0, 0, size, size, 12);
      ctx.fillStyle = wellGrad;
      ctx.fill();

      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          const x = pad + c * cell;
          const y = pad + r * cell;
          const isAlt = (r + c) % 2 === 0;
          roundRectPath(ctx, x + 2, y + 2, cell - 4, cell - 4, 6);
          ctx.fillStyle = isAlt ? 'rgba(244, 198, 104, 0.09)' : 'rgba(20, 8, 3, 0.26)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(176, 125, 67, 0.22)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    function resizeBoardCanvas() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      const wrap = document.getElementById('boardWrap');
      const frame = document.getElementById('boardFrame');
      const rect = wrap.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      const cs = getComputedStyle(frame);
      const frameX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0)
        + (parseFloat(cs.borderLeftWidth) || 0) + (parseFloat(cs.borderRightWidth) || 0);
      const frameY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0)
        + (parseFloat(cs.borderTopWidth) || 0) + (parseFloat(cs.borderBottomWidth) || 0);
      const avail = Math.min(rect.width - frameX - 2, rect.height - frameY - 6, 860);
      const side = Math.max(120, Math.floor(avail));
      boardCssSize = side;
      boardCanvas.style.width = `${side}px`;
      boardCanvas.style.height = `${side}px`;
      boardCanvas.width = Math.round(side * dpr);
      boardCanvas.height = Math.round(side * dpr);

      ghostCanvas.width = Math.round(window.innerWidth * dpr);
      ghostCanvas.height = Math.round(window.innerHeight * dpr);
      ghostCanvas.style.width = `${window.innerWidth}px`;
      ghostCanvas.style.height = `${window.innerHeight}px`;

      rebuildBoardBackgroundCache();
      renderTrayCanvases();
    }

    function drawGemTile(ctx, x, y, size, item, alpha = 1, nowSec = 0) {
      const pad = size >= 34 ? Math.max(1.8, size * 0.05) : Math.max(0.75, size * 0.042);
      const lineW = size >= 34 ? 2 : Math.max(1.1, size * 0.062);
      const bx = x + pad;
      const by = y + pad;
      const bs = Math.max(4, size - pad * 2);
      const rad = Math.max(3, bs * 0.2);

      ctx.save();
      ctx.globalAlpha = alpha;

      // Wooden Crate obstacle
      if (item.special === 'crate') {
        const g = ctx.createLinearGradient(bx, by, bx, by + bs);
        g.addColorStop(0, '#c28647');
        g.addColorStop(1, '#7a451a');
        roundRectPath(ctx, bx, by, bs, bs, rad);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.lineWidth = lineW;
        ctx.strokeStyle = '#381b0c';
        ctx.stroke();
        if (SPRITES.crate?.complete && SPRITES.crate.naturalWidth > 0) {
          ctx.drawImage(SPRITES.crate, bx + 2, by + 2, bs - 4, bs - 4);
        } else {
          ctx.strokeStyle = '#f4c668';
          ctx.lineWidth = lineW;
          ctx.beginPath();
          ctx.moveTo(bx + 6, by + 6); ctx.lineTo(bx + bs - 6, by + bs - 6);
          ctx.moveTo(bx + bs - 6, by + 6); ctx.lineTo(bx + 6, by + bs - 6);
          ctx.stroke();
        }
        ctx.restore();
        return;
      }

      const st = GEM_STYLES[item.colorIdx] || GEM_STYLES[0];

      // Warm drop shadow
      roundRectPath(ctx, bx, by + Math.max(1.2, size * 0.05), bs, bs, rad);
      ctx.fillStyle = 'rgba(22, 9, 3, 0.45)';
      ctx.fill();

      // Main 2.5D beveled jewel body
      const grad = ctx.createLinearGradient(bx, by, bx, by + bs);
      grad.addColorStop(0, st.top);
      grad.addColorStop(0.52, st.mid);
      grad.addColorStop(1, st.bot);
      roundRectPath(ctx, bx, by, bs, bs, rad);
      ctx.fillStyle = grad;
      ctx.fill();

      // Inner jewel facet
      const inset = bs * 0.16;
      roundRectPath(ctx, bx + inset, by + inset, bs - inset * 2, bs - inset * 2, rad * 0.55);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = Math.max(0.8, lineW * 0.6);
      ctx.stroke();

      // Specular highlight arc
      roundRectPath(ctx, bx + bs * 0.14, by + bs * 0.1, bs * 0.72, bs * 0.22, rad * 0.5);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fill();

      // Warm dark wood contour outline
      roundRectPath(ctx, bx, by, bs, bs, rad);
      ctx.lineWidth = lineW;
      ctx.strokeStyle = '#381b0c';
      ctx.stroke();

      // Special overlays
      if (item.special === 'bomb') {
        const pulse = REDUCED_MOTION ? 1 : 1 + Math.sin(nowSec * 9) * 0.06;
        const cx = bx + bs * 0.5;
        const cy = by + bs * 0.5;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(pulse, pulse);
        ctx.beginPath();
        ctx.arc(0, 0, bs * 0.36, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 246, 166, 0.36)';
        ctx.fill();
        if (SPRITES.bomb?.complete && SPRITES.bomb.naturalWidth > 0) {
          const s = bs * 0.82;
          ctx.drawImage(SPRITES.bomb, -s / 2, -s / 2, s, s);
        } else {
          ctx.beginPath();
          ctx.arc(0, 2, bs * 0.26, 0, Math.PI * 2);
          ctx.fillStyle = '#2b1409';
          ctx.fill();
          ctx.strokeStyle = '#f4c668';
          ctx.lineWidth = lineW;
          ctx.stroke();
        }
        ctx.restore();
      } else if (item.special === 'lightning') {
        const cx = bx + bs * 0.5;
        const cy = by + bs * 0.5;
        ctx.save();
        // High-contrast electric cyan aura so Lightning pops even on yellow Topaz gems
        ctx.beginPath();
        ctx.arc(cx, cy, bs * 0.34, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(14, 165, 233, 0.45)';
        ctx.fill();
        ctx.fillStyle = '#e0fbff';
        ctx.strokeStyle = '#0c2340';
        ctx.lineWidth = Math.max(0.95, bs * 0.055);
        ctx.beginPath();
        ctx.moveTo(cx + bs * 0.06, cy - bs * 0.32);
        ctx.lineTo(cx - bs * 0.22, cy + bs * 0.04);
        ctx.lineTo(cx - bs * 0.02, cy + bs * 0.04);
        ctx.lineTo(cx - bs * 0.09, cy + bs * 0.32);
        ctx.lineTo(cx + bs * 0.22, cy - bs * 0.05);
        ctx.lineTo(cx + bs * 0.02, cy - bs * 0.05);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else if (item.special === 'countdown') {
        const cx = bx + bs * 0.5;
        const cy = by + bs * 0.5;
        const urgent = (item.timer ?? 5) <= 2;
        const pulse = urgent && !REDUCED_MOTION ? 1 + Math.sin(nowSec * 14) * 0.09 : 1;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(pulse, pulse);
        // Subtle golden cross (+) rays signifying cross-blast when defused!
        ctx.strokeStyle = urgent ? '#fff6a6' : 'rgba(255, 246, 166, 0.78)';
        ctx.lineWidth = Math.max(1.5, bs * 0.075);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -bs * 0.42); ctx.lineTo(0, bs * 0.42);
        ctx.moveTo(-bs * 0.42, 0); ctx.lineTo(bs * 0.42, 0);
        ctx.stroke();
        // Dark iron bomb badge + timer digit
        ctx.beginPath();
        ctx.arc(0, 0, bs * 0.31, 0, Math.PI * 2);
        ctx.fillStyle = urgent ? '#99140a' : '#381b0c';
        ctx.fill();
        ctx.lineWidth = Math.max(1.4, bs * 0.06);
        ctx.strokeStyle = urgent ? '#fff6a6' : '#f4c668';
        ctx.stroke();
        ctx.fillStyle = '#fff6dc';
        ctx.font = `800 ${Math.round(bs * 0.38)}px "Be Vietnam Pro", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(item.timer ?? 4), 0, 1);
        ctx.restore();
      }

      ctx.restore();
    }

    function renderTrayCanvases() {
      const slotEls = Array.from(document.querySelectorAll('.hs-bb-slot'));
      if (slotEls.length === 0) return;

      const slotPad = 6;
      let minW = Infinity;
      let minH = Infinity;
      const slotDims = slotEls.map((slotEl) => {
        const w = Math.max(24, Math.floor(slotEl.clientWidth || slotEl.getBoundingClientRect().width));
        const h = Math.max(24, Math.floor(slotEl.clientHeight || slotEl.getBoundingClientRect().height));
        if (w < minW) minW = w;
        if (h < minH) minH = h;
        return { w, h };
      });

      let uniformCell = 32;
      for (const piece of state.tray) {
        if (!piece) continue;
        const { rows, cols } = getShapeBounds(piece.cells);
        uniformCell = Math.min(uniformCell, (minW - slotPad * 2) / cols, (minH - slotPad * 2) / rows);
      }
      uniformCell = Math.max(10, Math.floor(uniformCell));

      let allBlocked = true;
      let hasAnyPiece = false;

      slotEls.forEach((slotEl, slotOrder) => {
        const idx = Number(slotEl.dataset.slot);
        const piece = state.tray[idx];
        const canvas = slotEl.querySelector('canvas');
        const badge = slotEl.querySelector('.hs-bb-slot-badge');
        const { w, h } = slotDims[slotOrder];
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        const ctx = canvas.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        const fit = piece ? getPieceFitStatus(piece) : 'none';
        if (piece) {
          hasAnyPiece = true;
          if (fit !== 'blocked') allBlocked = false;
        }

        slotEl.classList.toggle('is-empty', !piece);
        slotEl.classList.toggle('is-selected', Boolean(piece) && state.selectedSlot === idx);
        slotEl.classList.toggle('is-dragging', Boolean(state.drag?.active && state.drag.slotIdx === idx));
        slotEl.classList.toggle('needs-rotate', fit === 'rotated');
        slotEl.classList.toggle('is-blocked', fit === 'blocked');
        if (badge) {
          badge.textContent = fit === 'rotated' ? '↻' : fit === 'blocked' ? '✕' : '';
        }

        if (!piece) return;
