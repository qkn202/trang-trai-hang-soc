        const { rows, cols } = getShapeBounds(piece.cells);
        const ox = (w - cols * uniformCell) / 2;
        const oy = (h - rows * uniformCell) / 2;

        for (let i = 0; i < piece.cells.length; i++) {
          const [r, c] = piece.cells[i];
          drawGemTile(
            ctx,
            ox + c * uniformCell,
            oy + r * uniformCell,
            uniformCell,
            {
              colorIdx: piece.colorIdx,
              special: i === piece.specialCellIdx ? piece.special : null,
            },
            1,
            performance.now() / 1000
          );
        }
      });

      // Highlight rescue spells when all remaining pieces are blocked!
      const rescueNeeded = hasAnyPiece && allBlocked && state.status === 'playing';
      btnSpellHammer.classList.toggle('is-hint', rescueNeeded && state.hammerQty > 0 && !state.hammerArmed);
      btnSpellShuffle.classList.toggle('is-hint', rescueNeeded && state.shuffleQty > 0);
    }

    function getDragLiftY(pointerType, rows, cell) {
      return pointerType === 'touch' ? -Math.max(58, rows * cell * 0.52 + 26) : 0;
    }

    function renderDragGhost(nowSec) {
      if (!state.drag?.active) {
        if (ghostVisible) {
          gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          gctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          ghostCanvas.style.display = 'none';
          ghostVisible = false;
        }
        return;
      }
      if (!ghostVisible) {
        ghostCanvas.style.display = 'block';
        ghostVisible = true;
      }
      gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      gctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      const piece = state.tray[state.drag.slotIdx];
      if (!piece) return;

      const { cell } = getBoardMetrics();
      const { rows, cols } = getShapeBounds(piece.cells);
      const liftY = getDragLiftY(state.drag.pointerType, rows, cell);
      const drawX = state.drag.clientX - (cols * cell) / 2;
      const drawY = state.drag.clientY + liftY - (rows * cell) / 2;

      for (let i = 0; i < piece.cells.length; i++) {
        const [r, c] = piece.cells[i];
        drawGemTile(
          gctx,
          drawX + c * cell,
          drawY + r * cell,
          cell,
          {
            colorIdx: piece.colorIdx,
            special: i === piece.specialCellIdx ? piece.special : null,
          },
          0.92,
          nowSec
        );
      }
    }

    function renderBoard(nowSec) {
      const { size, pad, cell } = getBoardMetrics();
      bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      bctx.clearRect(0, 0, size, size);

      bctx.save();
      if (state.shakeTime > 0 && !REDUCED_MOTION) {
        const mag = state.shakeMag * (state.shakeTime / 0.25);
        bctx.translate((Math.random() - 0.5) * mag * 2, (Math.random() - 0.5) * mag * 2);
      }

      // Blit cached static carved-wood 8×8 grid
      bctx.drawImage(boardBgCanvas, 0, 0, size, size);

      // Highlight rows/cols that WILL EXPLODE on valid drag snap (or desktop hover preview)
      const activePreview = state.drag?.active ? state.drag : getHoverSnapPreview();
      if (activePreview && activePreview.valid) {
        const pulse = 0.22 + Math.sin(nowSec * 12) * 0.08;
        bctx.fillStyle = `rgba(245, 179, 1, ${pulse})`;
        for (const r of activePreview.previewRows) {
          roundRectPath(bctx, pad, pad + r * cell, cell * GRID, cell, 8);
          bctx.fill();
          bctx.strokeStyle = '#ffe58f';
          bctx.lineWidth = 2;
          bctx.stroke();
        }
        for (const c of activePreview.previewCols) {
          roundRectPath(bctx, pad + c * cell, pad, cell, cell * GRID, 8);
          bctx.fill();
          bctx.strokeStyle = '#ffe58f';
          bctx.lineWidth = 2;
          bctx.stroke();
        }
      }

      // Existing tiles on grid
      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          const item = state.grid[r][c];
          if (!item) continue;
          const x = pad + c * cell;
          const y = pad + r * cell + (item.dropY || 0);
          const sc = item.scale ?? 1;
          if (sc !== 1) {
            bctx.save();
            bctx.translate(x + cell / 2, y + cell / 2);
            bctx.scale(sc, sc);
            drawGemTile(bctx, -cell / 2, -cell / 2, cell, item, 1, nowSec);
            bctx.restore();
          } else {
            drawGemTile(bctx, x, y, cell, item, 1, nowSec);
          }
          if ((item.dropY || 0) < -6 && !REDUCED_MOTION) {
            const trailH = Math.min(cell * 1.1, Math.abs(item.dropY));
            const tg = bctx.createLinearGradient(x, y - trailH, x, y + 4);
            tg.addColorStop(0, 'rgba(255, 246, 166, 0)');
            tg.addColorStop(1, 'rgba(245, 179, 1, 0.55)');
            bctx.fillStyle = tg;
            bctx.fillRect(x + cell * 0.22, y - trailH, cell * 0.56, trailH);
          }
        }
      }

      // Valid Snap Ghost OR Invalid Red Feedback Cells
      if (activePreview) {
        const piece = state.tray[activePreview.slotIdx];
        if (piece && activePreview.valid) {
          for (let i = 0; i < piece.cells.length; i++) {
            const [dr, dc] = piece.cells[i];
            drawGemTile(
              bctx,
              pad + (activePreview.snapC + dc) * cell,
              pad + (activePreview.snapR + dr) * cell,
              cell,
              { colorIdx: piece.colorIdx, special: i === piece.specialCellIdx ? piece.special : null },
              state.drag?.active ? 0.48 : 0.3,
              nowSec
            );
          }
        } else if (piece && state.drag?.active && activePreview.overBoard) {
          bctx.fillStyle = 'rgba(224, 62, 54, 0.36)';
          bctx.strokeStyle = 'rgba(255, 200, 180, 0.78)';
          bctx.lineWidth = 2;
          for (const [dr, dc] of piece.cells) {
            const rr = activePreview.snapR + dr;
            const cc = activePreview.snapC + dc;
            if (rr >= 0 && rr < GRID && cc >= 0 && cc < GRID) {
              roundRectPath(bctx, pad + cc * cell + 3, pad + rr * cell + 3, cell - 6, cell - 6, 7);
              bctx.fill();
              bctx.stroke();
            }
          }
        }
      }

      // Live Hammer 3×3 Targeting Reticle
      if (state.hammerArmed && state.hoverCell) {
        const { r: hr, c: hc } = state.hoverCell;
        const r0 = Math.max(0, hr - 1), r1 = Math.min(GRID - 1, hr + 1);
        const c0 = Math.max(0, hc - 1), c1 = Math.min(GRID - 1, hc + 1);
        const pulse = 0.24 + Math.sin(nowSec * 11) * 0.08;
        bctx.save();
        roundRectPath(
          bctx,
          pad + c0 * cell + 1,
          pad + r0 * cell + 1,
          (c1 - c0 + 1) * cell - 2,
          (r1 - r0 + 1) * cell - 2,
          10
        );
        bctx.fillStyle = `rgba(255, 133, 27, ${pulse})`;
        bctx.fill();
        bctx.lineWidth = 3;
        bctx.strokeStyle = '#fff6a6';
        bctx.stroke();
        bctx.restore();
      }

      // Blazing Cross-Fire Beams
      for (const b of state.beams) {
        const t = 1 - b.age / b.maxAge;
        bctx.save();
        bctx.globalCompositeOperation = 'lighter';
        bctx.globalAlpha = Math.max(0, t);
        if (b.type === 'row') {
          const cy = pad + (b.index + 0.5) * cell;
          const h = cell * (0.4 + t * 0.65);
          const g = bctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
          g.addColorStop(0, 'rgba(255,133,27,0)');
          g.addColorStop(0.35, b.color);
          g.addColorStop(0.5, '#fff6a6');
          g.addColorStop(0.65, b.color);
          g.addColorStop(1, 'rgba(255,133,27,0)');
          bctx.fillStyle = g;
          bctx.fillRect(pad - 6, cy - h / 2, cell * GRID + 12, h);
        } else {
          const cx = pad + (b.index + 0.5) * cell;
          const w = cell * (0.4 + t * 0.65);
          const g = bctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
          g.addColorStop(0, 'rgba(255,133,27,0)');
          g.addColorStop(0.35, b.color);
          g.addColorStop(0.5, '#fff6a6');
          g.addColorStop(0.65, b.color);
          g.addColorStop(1, 'rgba(255,133,27,0)');
          bctx.fillStyle = g;
          bctx.fillRect(cx - w / 2, pad - 6, w, cell * GRID + 12);
        }
        bctx.restore();
      }

      // Expanding Shockwave Rings
      for (const sw of state.shockwaves) {
        const p = sw.age / sw.maxAge;
        bctx.save();
        bctx.globalAlpha = Math.max(0, 1 - p);
        bctx.strokeStyle = sw.color;
        bctx.lineWidth = Math.max(1.5, 6 * (1 - p));
        bctx.beginPath();
        bctx.arc(sw.x, sw.y, sw.maxR * p, 0, Math.PI * 2);
        bctx.stroke();
        bctx.restore();
      }

      // Crystal Shards & Fiery Embers
      for (const pt of state.particles) {
        const p = pt.age / pt.maxAge;
        bctx.save();
        bctx.globalAlpha = Math.max(0, 1 - p);
        bctx.translate(pt.x, pt.y);
        bctx.rotate(pt.rot);
        bctx.fillStyle = pt.color;
        if (pt.shape === 'diamond') {
          const s = pt.size * (1 - p * 0.35);
          bctx.beginPath();
          bctx.moveTo(0, -s);
          bctx.lineTo(s * 0.75, 0);
          bctx.lineTo(0, s);
          bctx.lineTo(-s * 0.75, 0);
          bctx.closePath();
          bctx.fill();
        } else {
          bctx.beginPath();
          bctx.arc(0, 0, pt.size * 0.55 * (1 - p * 0.4), 0, Math.PI * 2);
          bctx.fill();
        }
        bctx.restore();
      }

      // Warm Golden Impact Flash
      if (state.flashAlpha > 0.005) {
        bctx.fillStyle = `rgba(255, 246, 166, ${state.flashAlpha})`;
        bctx.fillRect(0, 0, size, size);
      }

      // Floating Arcade Combo Callouts (width-measured & clamped so they NEVER clip!)
      for (const fl of state.floaters) {
        const p = fl.age / fl.maxAge;
        const popScale = p < 0.16 ? 0.65 + (p / 0.16) * 0.45 : 1.05 - p * 0.1;
        const alpha = p < 0.72 ? 1 : Math.max(0, 1 - (p - 0.72) / 0.28);
        const yOff = -p * 44;
        bctx.save();
        bctx.globalAlpha = alpha;
        bctx.font = '800 20px "Be Vietnam Pro", sans-serif';
        const measuredW = Math.max(40, bctx.measureText(fl.text).width);
        const effScale = Math.min(fl.scale * popScale, (size - 24) / measuredW);
        const halfW = (measuredW * effScale) / 2 + 12;
        const fx = Math.max(halfW, Math.min(size - halfW, fl.x));
        const fy = Math.max(28, Math.min(size - 40, fl.y + yOff));
        bctx.translate(fx, fy);
        bctx.scale(effScale, effScale);
        bctx.textAlign = 'center';
        bctx.textBaseline = 'middle';
        bctx.lineWidth = 5;
        bctx.strokeStyle = '#381b0c';
        bctx.strokeText(fl.text, 0, 0);
        bctx.fillStyle = fl.color;
        bctx.fillText(fl.text, 0, 0);
        if (fl.sub) {
          bctx.font = '800 15px "Be Vietnam Pro", sans-serif';
          bctx.lineWidth = 4;
          bctx.strokeText(fl.sub, 0, 22);
          bctx.fillStyle = '#fff6dc';
          bctx.fillText(fl.sub, 0, 22);
        }
        bctx.restore();
      }

      bctx.restore();
    }

    // =========================================================================
    // 6. MAIN 60FPS ANIMATION LOOP
    // =========================================================================
    let lastTime = performance.now();
    function frame(now) {
      const rawDt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
      lastTime = now;

      let dt = rawDt;
      if (state.hitStopTimer > 0) {
        state.hitStopTimer = Math.max(0, state.hitStopTimer - rawDt);
        dt = rawDt * 0.12;
      }

      if (state.shakeTime > 0) state.shakeTime = Math.max(0, state.shakeTime - rawDt);
      if (state.flashAlpha > 0) state.flashAlpha = Math.max(0, state.flashAlpha - rawDt * 1.4);
      if (state.toastTimer > 0) {
        state.toastTimer = Math.max(0, state.toastTimer - rawDt);
        if (state.toastTimer === 0) syncBannerDOM();
      }

      for (let r = 0; r < GRID; r++) {
        for (let c = 0; c < GRID; c++) {
          const item = state.grid[r][c];
          if (!item) continue;
          if (item.dropY && item.dropY < 0) {
            item.dropY = Math.min(0, item.dropY + dt * 980);
          }
          if (item.scale !== undefined && item.scale < 1) {
            item.scale = Math.min(1, item.scale + dt * 5.2);
          }
        }
      }

      // Resolve delayed Tetris cascade clear & ALWAYS check win/loss once cascade finishes!
      if (state.cascadePending) {
        state.cascadePending.timer -= rawDt;
        if (state.cascadePending.timer <= 0) {
          const { anchorR, anchorC, chargeRage } = state.cascadePending;
          state.cascadePending = null;
          resolveClearsAndExplosions(anchorR, anchorC, true, null, { chargeRage });
          if (!state.cascadePending) {
            maybeSpawnBonusBomb();
            if (!state.cascadePending) {
              checkWinOrLoss();
            }
          }
          syncHudDOM();
          renderTrayCanvases();
        }
      }

      for (let i = state.beams.length - 1; i >= 0; i--) {
        state.beams[i].age += dt;
        if (state.beams[i].age >= state.beams[i].maxAge) state.beams.splice(i, 1);
      }
      for (let i = state.shockwaves.length - 1; i >= 0; i--) {
        state.shockwaves[i].age += dt;
        if (state.shockwaves[i].age >= state.shockwaves[i].maxAge) state.shockwaves.splice(i, 1);
      }
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const pt = state.particles[i];
        pt.age += dt;
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vy += 460 * dt;
        pt.rot += pt.vrot * dt;
        if (pt.age >= pt.maxAge) state.particles.splice(i, 1);
      }
      for (let i = state.floaters.length - 1; i >= 0; i--) {
        state.floaters[i].age += rawDt;
        if (state.floaters[i].age >= state.floaters[i].maxAge) state.floaters.splice(i, 1);
      }

      const nowSec = now / 1000;
      renderBoard(nowSec);
      renderDragGhost(nowSec);
      requestAnimationFrame(frame);
    }

    // =========================================================================
    // 7. HUD DOM SYNC & RESULT DIALOG
    // =========================================================================
    const uiScore = document.getElementById('uiScore');
    const uiBest = document.getElementById('uiBest');
    const uiComboPill = document.getElementById('uiComboPill');
    const uiStageBadge = document.getElementById('uiStageBadge');
    const uiProgressFill = document.getElementById('uiProgressFill');
    const uiProgressTxt = document.getElementById('uiProgressTxt');
    const uiGoalChips = document.getElementById('uiGoalChips');
    const uiRageLabel = document.getElementById('uiRageLabel');
    const uiRagePct = document.getElementById('uiRagePct');
    const uiRageFill = document.getElementById('uiRageFill');
    const btnDragonBlast = document.getElementById('btnDragonBlast');
    const uiHammerQty = document.getElementById('uiHammerQty');
    const uiShuffleQty = document.getElementById('uiShuffleQty');
    const btnSpellHammer = document.getElementById('btnSpellHammer');
    const btnSpellShuffle = document.getElementById('btnSpellShuffle');
    const boardFrame = document.getElementById('boardFrame');
    const boardBanner = document.getElementById('boardBanner');
    const resultDialog = document.getElementById('resultDialog');
    const btnMute = document.getElementById('btnMute');

    function syncMuteDOM() {
      btnMute.textContent = soundEnabled ? 'Âm: Bật' : 'Âm: Tắt';
      btnMute.setAttribute('aria-pressed', String(!soundEnabled));
    }

    function syncBannerDOM() {
      if (state.hammerArmed) {
        boardBanner.textContent = 'Chạm vùng gạch để đập Búa 3×3! (ESC để hủy)';
        boardBanner.classList.add('is-visible');
      } else if (state.toastTimer > 0 && state.toastText) {
        boardBanner.textContent = state.toastText;
        boardBanner.classList.add('is-visible');
      } else {
        boardBanner.classList.remove('is-visible');
      }
    }

    function syncHudDOM() {
      uiScore.textContent = state.score.toLocaleString('vi-VN');
      uiBest.textContent = getCurrentBest().toLocaleString('vi-VN');
      uiComboPill.innerHTML = `<span>Combo ×${Math.max(1, state.combo)}</span>`;
      if (state.combo >= 2) {
        uiComboPill.classList.add('pop');
        setTimeout(() => uiComboPill.classList.remove('pop'), 160);
      }

      if (state.mode === 'stage') {
        uiStageBadge.textContent = `Màn ${state.stage}`;
        const pct = Math.min(100, Math.round((state.score / Math.max(1, state.stageGoalScore)) * 100));
        uiProgressFill.style.width = `${pct}%`;
        uiProgressTxt.textContent = `${state.score.toLocaleString('vi-VN')} / ${state.stageGoalScore.toLocaleString('vi-VN')}`;
        const bombDone = state.stageBombsCleared >= state.stageGoalBombs;
        const crateDone = state.stageCratesCleared >= state.stageGoalCrates;
        uiGoalChips.innerHTML = `
          <span class="hs-bb-goal-chip ${bombDone ? 'is-done' : ''}">
            <img src="../sprites/m3_sp_bomb.webp" alt="" />
            Bom ${Math.min(state.stageBombsCleared, state.stageGoalBombs)}/${state.stageGoalBombs}
          </span>
          <span class="hs-bb-goal-chip ${crateDone ? 'is-done' : ''}">
            <img src="../sprites/m3_obs_box_1.webp" alt="" />
            Thùng ${Math.min(state.stageCratesCleared, state.stageGoalCrates)}/${state.stageGoalCrates}
          </span>
        `;
      } else {
        uiStageBadge.textContent = 'Vô Tận';
        const milestone = Math.ceil((state.score + 1) / ENDLESS_MILESTONE_STEP) * ENDLESS_MILESTONE_STEP;
        const pct = Math.min(100, Math.round(((state.score % ENDLESS_MILESTONE_STEP) / ENDLESS_MILESTONE_STEP) * 100));
        uiProgressFill.style.width = `${pct}%`;
        uiProgressTxt.textContent = `Mốc ${milestone.toLocaleString('vi-VN')} đ`;
        uiGoalChips.innerHTML = `
          <span class="hs-bb-goal-chip">
            <img src="../sprites/m3_sp_bomb.webp" alt="" />
            Nổ đỉnh: ${state.biggestBlast} ô
          </span>
        `;
      }

      const rageDisplay = Math.min(100, Math.floor(state.rage));
      const rageReady = isDragonRageReady();
      uiRagePct.textContent = `${rageDisplay}%`;
      uiRageFill.style.width = `${rageDisplay}%`;
      uiRageLabel.textContent = rageReady ? 'KÍCH NỔ HỎA LONG!' : 'Nộ Hỏa Long';
      btnDragonBlast.classList.toggle('is-ready', rageReady);
      btnDragonBlast.setAttribute('aria-disabled', String(!rageReady));

      uiHammerQty.textContent = `×${state.hammerQty}`;
      uiShuffleQty.textContent = `×${state.shuffleQty}`;
      btnSpellHammer.disabled = state.hammerQty <= 0 || state.status !== 'playing';
      btnSpellHammer.classList.toggle('is-armed', state.hammerArmed);
      btnSpellShuffle.disabled = state.shuffleQty <= 0 || state.status !== 'playing';
      boardFrame.classList.toggle('hammer-armed', state.hammerArmed);
      boardCanvas.classList.toggle('is-hammer', state.hammerArmed);
      syncBannerDOM();
    }

    function openResultDialog(won) {
      const isFinalStage = won && state.mode === 'stage' && state.stage >= MAX_STAGE;
      document.getElementById('dlgTitle').textContent = isFinalStage
        ? 'Chinh Phục Trọn 777 Màn Hang Sóc!'
        : won
          ? `Chiến Thắng Màn ${state.stage}!`
          : state.mode === 'endless'
            ? 'Kết Thúc Ván Đua Điểm!'
            : `Hết Nước Đi · Màn ${state.stage}`;
      document.getElementById('dlgScore').textContent = state.score.toLocaleString('vi-VN');
      document.getElementById('dlgMaxCombo').textContent = `×${state.maxCombo}`;
      document.getElementById('dlgBiggestBlast').textContent = `${state.biggestBlast} ô`;
      document.getElementById('dlgBest').textContent = getCurrentBest().toLocaleString('vi-VN');
      document.getElementById('dlgNote').textContent = isFinalStage
        ? 'Đỉnh cao phù thủy Hang Sóc! Bạn đã hoàn tất toàn bộ 777 màn — thử phá kỷ lục ở chế độ Vô Tận nhé!'
        : won
          ? 'Cú nổ dây chuyền quá mãn nhãn! Chuyển tiếp sang màn tiếp theo với bố cục Khối Bom & Thùng Gỗ mới.'
          : 'Mẹo: Nhấn Xoay (R), dùng Búa 3×3 hoặc tích đầy Nộ Hỏa Long để lật kèo phút chót!';

      const btnPri = document.getElementById('btnDlgPrimary');
      const btnSec = document.getElementById('btnDlgSecondary');
      if (isFinalStage) {
        btnPri.textContent = 'Chơi Vô Tận';
        btnPri.value = 'endless';
        btnSec.textContent = 'Chơi lại Màn 777';
        btnSec.value = 'retry';
        btnSec.hidden = false;
      } else if (won) {
        btnPri.textContent = `Sang Màn ${state.stage + 1}`;
        btnPri.value = 'next';
        btnSec.textContent = 'Chơi lại';
        btnSec.value = 'retry';
        btnSec.hidden = false;
      } else {
        btnPri.textContent = 'Nổ Lại Ngay';
        btnPri.value = 'retry';
        if (state.mode === 'stage' && state.stage > 1) {
          btnSec.textContent = 'Về Màn 1';
          btnSec.value = 'stage1';
          btnSec.hidden = false;
        } else {
          btnSec.hidden = true;
        }
      }
      if (!resultDialog.open) resultDialog.showModal();
    }

    resultDialog.addEventListener('close', () => {
      if (suppressDialogCloseAction) {
        suppressDialogCloseAction = false;
        resultDialog.returnValue = '';
        return;
      }
      const action = resultDialog.returnValue;
      resultDialog.returnValue = '';
      if (action === 'endless') {
        switchMode('endless');
      } else if (action === 'next' && state.status === 'won') {
        setupStage(Math.min(MAX_STAGE, state.stage + 1));
      } else if (action === 'stage1') {
        setupStage(1);
      } else if (action === 'retry') {
        setupStage(state.mode === 'stage' ? state.stage : 1);
      } else if (state.status === 'won') {
        // ESC pressed on victory modal advances cleanly instead of replaying the cleared stage
        setupStage(Math.min(MAX_STAGE, state.stage + 1));
      } else if (state.status === 'lost') {
        setupStage(state.mode === 'stage' ? state.stage : 1);
      }
    });

    // =========================================================================
    // 8. POINTER DRAG & DROP, HOVER PREVIEW, ROTATION & KEYBOARD ACCESSIBILITY
    // =========================================================================
    function computeSnapForClient(piece, clientX, clientY, pointerType) {
      const rect = boardCanvas.getBoundingClientRect();
      const { pad, cell } = getBoardMetrics();
      const { rows, cols } = getShapeBounds(piece.cells);
      const liftY = getDragLiftY(pointerType, rows, cell);
      const localX = clientX - rect.left - (cols * cell) / 2;
      const localY = clientY + liftY - rect.top - (rows * cell) / 2;
      const rawC = (localX - pad) / cell;
      const rawR = (localY - pad) / cell;
      const snapC = Math.round(rawC);
      const snapR = Math.round(rawR);

      // Reject drops dragged outside the board so dragging back to dock cleanly cancels!
      const overBoard =
        rawC >= -0.6 && rawC <= GRID - cols + 0.6 &&
        rawR >= -0.6 && rawR <= GRID - rows + 0.6;
      if (!overBoard) {
        return { snapR, snapC, valid: false, overBoard: false, previewRows: [], previewCols: [] };
      }

      // Distance-sorted +/-1 magnetic search so snapping picks the truly closest valid slot
      const candidates = [
        [snapR, snapC],
        [snapR, snapC - 1], [snapR, snapC + 1],
        [snapR - 1, snapC], [snapR + 1, snapC],
      ].sort((a, b) => {
        const da = (a[0] - rawR) ** 2 + (a[1] - rawC) ** 2;
        const db = (b[0] - rawR) ** 2 + (b[1] - rawC) ** 2;
        return da - db;
      });

      for (const [r, c] of candidates) {
        if (canPlacePieceAt(piece, r, c)) {
          const { previewRows, previewCols } = previewFullLinesWithPiece(piece, r, c);
          return { snapR: r, snapC: c, valid: true, overBoard: true, previewRows, previewCols };
        }
      }
      return { snapR, snapC, valid: false, overBoard: true, previewRows: [], previewCols: [] };
    }

    function computeClickSnapOnBoard(piece, cellR, cellC) {
      const { rows, cols } = getShapeBounds(piece.cells);
      const baseR = Math.max(0, Math.min(GRID - rows, cellR - Math.floor(rows / 2)));
      const baseC = Math.max(0, Math.min(GRID - cols, cellC - Math.floor(cols / 2)));
      const candidates = [
        [baseR, baseC],
        [baseR, baseC - 1], [baseR, baseC + 1],
        [baseR - 1, baseC], [baseR + 1, baseC],
      ];
      for (const [r, c] of candidates) {
        if (canPlacePieceAt(piece, r, c)) {
          const { previewRows, previewCols } = previewFullLinesWithPiece(piece, r, c);
          return { snapR: r, snapC: c, valid: true, overBoard: true, previewRows, previewCols };
        }
      }
      return null;
    }

    function getHoverSnapPreview() {
      if (!state.hoverCell || state.hammerArmed || state.status !== 'playing' || state.cascadePending) return null;
      const piece = state.tray[state.selectedSlot];
      if (!piece) return null;
      const snap = computeClickSnapOnBoard(piece, state.hoverCell.r, state.hoverCell.c);
      return snap ? { slotIdx: state.selectedSlot, ...snap } : null;
    }

    function rotateSlot(slotIdx) {
      const piece = state.tray[slotIdx];
      if (!piece || state.status !== 'playing') return;
      piece.cells = rotateCellsCW(piece.cells);
      playRotateSfx();
      renderTrayCanvases();
    }

    document.querySelectorAll('.hs-bb-slot').forEach((slotEl) => {
      const idx = Number(slotEl.dataset.slot);
      let downX = 0, downY = 0, wasSelected = false;

      slotEl.addEventListener('pointerdown', (e) => {
        if (state.status !== 'playing' || state.cascadePending) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (state.drag) return; // Ignore secondary fingers during active drag
        const piece = state.tray[idx];
        if (!piece) return;
        ensureAudio();
        if (state.hammerArmed) {
          state.hammerArmed = false;
          syncHudDOM();
        }
        wasSelected = state.selectedSlot === idx;
        state.selectedSlot = idx;
        downX = e.clientX;
        downY = e.clientY;
        slotEl.setPointerCapture(e.pointerId);
        state.drag = {
          slotIdx: idx,
          pointerId: e.pointerId,
          pointerType: e.pointerType,
          clientX: e.clientX,
          clientY: e.clientY,
          active: false, // Activates only after moving > 8px (zero flash on quick tap!)
          snapR: -1,
          snapC: -1,
          valid: false,
          overBoard: false,
          previewRows: [],
          previewCols: [],
        };
        renderTrayCanvases();
      });

      slotEl.addEventListener('pointermove', (e) => {
        if (!state.drag || state.drag.slotIdx !== idx || state.drag.pointerId !== e.pointerId) return;
        const piece = state.tray[idx];
        if (!piece) return;
        const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
        if (!state.drag.active && dist > 8) {
          state.drag.active = true;
          renderTrayCanvases();
        }
        if (!state.drag.active) return;
        const snap = computeSnapForClient(piece, e.clientX, e.clientY, e.pointerType);
        state.drag.clientX = e.clientX;
        state.drag.clientY = e.clientY;
        state.drag.snapR = snap.snapR;
        state.drag.snapC = snap.snapC;
        state.drag.valid = snap.valid;
        state.drag.overBoard = snap.overBoard;
        state.drag.previewRows = snap.previewRows;
        state.drag.previewCols = snap.previewCols;
      });

      const endDrag = (e) => {
        if (!state.drag || state.drag.slotIdx !== idx || state.drag.pointerId !== e.pointerId) return;
        const drag = state.drag;
        state.drag = null;
        if (drag.active && drag.valid) {
          placePieceOnBoard(idx, drag.snapR, drag.snapC);
        } else if (!drag.active) {
          if (wasSelected) {
            rotateSlot(idx);
          } else {
            renderTrayCanvases();
          }
        } else {
          if (drag.overBoard) playInvalidSfx();
          renderTrayCanvases();
        }
      };

      slotEl.addEventListener('pointerup', endDrag);
      slotEl.addEventListener('pointercancel', () => {
        if (state.drag && state.drag.slotIdx === idx) {
          state.drag = null;
          renderTrayCanvases();
        }
      });

      // Keyboard accessibility on tray slots (Enter / Space)
      slotEl.addEventListener('keydown', (e) => {
        if (state.status !== 'playing' || state.cascadePending) return;
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          const piece = state.tray[idx];
          if (!piece) return;
          ensureAudio();
          if (state.selectedSlot === idx) {
            rotateSlot(idx);
          } else {
            state.selectedSlot = idx;
            renderTrayCanvases();
          }
        }
      });
    });

    function clientToBoardCell(clientX, clientY) {
      const rect = boardCanvas.getBoundingClientRect();
      const { pad, cell } = getBoardMetrics();
      const c = Math.floor((clientX - rect.left - pad) / cell);
      const r = Math.floor((clientY - rect.top - pad) / cell);
      if (r < 0 || r >= GRID || c < 0 || c >= GRID) return null;
      return { r, c };
    }

    boardCanvas.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      state.hoverCell = clientToBoardCell(e.clientX, e.clientY);
    });

    boardCanvas.addEventListener('pointerleave', () => {
      state.hoverCell = null;
    });

    boardCanvas.addEventListener('pointerdown', (e) => {
      if (state.status !== 'playing' || state.cascadePending) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      ensureAudio();
      const pos = clientToBoardCell(e.clientX, e.clientY);
      if (!pos) return;

      if (state.hammerArmed) {
        fireHammerAt(pos.r, pos.c);
        return;
      }
      const piece = state.tray[state.selectedSlot];
      if (piece) {
        const snap = computeClickSnapOnBoard(piece, pos.r, pos.c);
        if (snap && snap.valid) {
          placePieceOnBoard(state.selectedSlot, snap.snapR, snap.snapC);
        } else {
          playInvalidSfx();
        }
      }
    });

    // Toolbar controls
    document.getElementById('btnRotate').addEventListener('click', () => {
      ensureAudio();
      rotateSlot(state.selectedSlot);
    });

    btnSpellHammer.addEventListener('click', () => {
      if (state.hammerQty <= 0 || state.status !== 'playing' || state.cascadePending) return;
      ensureAudio();
      state.hammerArmed = !state.hammerArmed;
      syncHudDOM();
    });

    btnSpellShuffle.addEventListener('click', () => {
      if (state.shuffleQty <= 0 || state.status !== 'playing' || state.cascadePending) return;
      ensureAudio();
      state.shuffleQty--;
      state.hammerArmed = false;
      refillTray(true);
      playRotateSfx();
      checkWinOrLoss();
      syncHudDOM();
      renderTrayCanvases();
    });

    btnDragonBlast.addEventListener('click', () => {
      if (!isDragonRageReady() || state.cascadePending) return;
      ensureAudio();
      triggerDragonRageBlast();
    });

    document.getElementById('btnRestart').addEventListener('click', () => {
      ensureAudio();
      setupStage(state.mode === 'stage' ? state.stage : 1);
    });

    function applySoundEnabled(nextEnabled) {
      soundEnabled = Boolean(nextEnabled);
      safeSet(STORAGE_KEYS.muted, soundEnabled ? '0' : '1');
      if (!soundEnabled && audioCtx?.state === 'running') {
        audioCtx.suspend().catch(() => {});
      }
      syncMuteDOM();
    }

    btnMute.addEventListener('click', () => {
      applySoundEnabled(!soundEnabled);
    });

    const btnModeStage = document.getElementById('btnModeStage');
    const btnModeEndless = document.getElementById('btnModeEndless');
    function switchMode(mode) {
      state.mode = mode;
      btnModeStage.setAttribute('aria-selected', String(mode === 'stage'));
      btnModeEndless.setAttribute('aria-selected', String(mode === 'endless'));
      const savedStage = Math.min(MAX_STAGE, Math.max(1, state.unlockedStage || Number(safeGet(STORAGE_KEYS.unlockedStage, '1')) || 1));
      setupStage(mode === 'stage' ? savedStage : 1);
    }
    btnModeStage.addEventListener('click', () => switchMode('stage'));
    btnModeEndless.addEventListener('click', () => switchMode('endless'));

    const btnGravityToggle = document.getElementById('btnGravityToggle');
    btnGravityToggle.addEventListener('click', () => {
      state.gravityEnabled = !state.gravityEnabled;
      btnGravityToggle.setAttribute('aria-pressed', String(state.gravityEnabled));
      btnGravityToggle.textContent = state.gravityEnabled ? 'Sập tầng: BẬT' : 'Sập tầng: TẮT';
    });

    window.addEventListener('keydown', (e) => {
      if (state.status !== 'playing') return;
      if (e.code === 'KeyR' || e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        const targetIdx = state.drag ? state.drag.slotIdx : state.selectedSlot;
        rotateSlot(targetIdx);
        if (state.drag?.active && state.tray[targetIdx]) {
          const snap = computeSnapForClient(
            state.tray[targetIdx],
            state.drag.clientX,
            state.drag.clientY,
            state.drag.pointerType
          );
          Object.assign(state.drag, snap);
        }
      } else if (e.key === '1' || e.key === '2' || e.key === '3') {
        const idx = Number(e.key) - 1;
        if (state.tray[idx]) {
          state.selectedSlot = idx;
          renderTrayCanvases();
        }
      } else if (e.key === 'Escape') {
        if (state.drag) {
          state.drag = null;
          renderTrayCanvases();
        } else if (state.hammerArmed) {
          state.hammerArmed = false;
          syncHudDOM();
        }
      }
    });

    // =========================================================================
    // 9. HPVN BONUS ARCADE TWO-WAY postMessage BRIDGE
    // =========================================================================
    window.addEventListener('message', (ev) => {
      const data = ev?.data;
      if (!data || typeof data !== 'object') return;
      if (data.channel !== BONUS_CHANNEL || data.gameId !== GAME_ID) return;
      if (EMBED_TOKEN && data.token && data.token !== EMBED_TOKEN) return;

      if (data.type === 'init') {
        const rec = (data.record && typeof data.record === 'object')
          ? data.record
          : (data.state && typeof data.state === 'object')
            ? data.state
            : data;

        const incomingStage = Number(rec.unlockedStage ?? data.unlockedStage);
        if (Number.isFinite(incomingStage) && incomingStage >= 1) {
          const clamped = Math.min(MAX_STAGE, Math.floor(incomingStage));
          state.unlockedStage = Math.max(state.unlockedStage, clamped);
          safeSet(STORAGE_KEYS.unlockedStage, state.unlockedStage);
        }

        const incomingBestScore = Number(rec.bestScore ?? data.bestScore);
        const incomingBestStage = Number(rec.bestStage ?? data.bestStage ?? incomingBestScore);
        const incomingBestEndless = Number(rec.bestEndless ?? data.bestEndless ?? incomingBestScore);
        if (Number.isFinite(incomingBestStage) && incomingBestStage > state.bestStage) {
          state.bestStage = Math.floor(incomingBestStage);
          safeSet(STORAGE_KEYS.bestStage, state.bestStage);
        }
        if (Number.isFinite(incomingBestEndless) && incomingBestEndless > state.bestEndless) {
          state.bestEndless = Math.floor(incomingBestEndless);
          safeSet(STORAGE_KEYS.bestEndless, state.bestEndless);
        }

        const incomingBestCombo = Number(rec.bestCombo ?? data.bestCombo);
        if (Number.isFinite(incomingBestCombo) && incomingBestCombo > state.bestComboAllTime) {
          state.bestComboAllTime = Math.floor(incomingBestCombo);
        }

        const incomingSound = typeof data.soundEnabled === 'boolean'
          ? data.soundEnabled
          : (typeof rec.soundEnabled === 'boolean' ? rec.soundEnabled : null);
        if (incomingSound !== null) {
          applySoundEnabled(incomingSound);
        }

        if (typeof data.reducedMotion === 'boolean') {
          REDUCED_MOTION = REDUCED_MOTION || data.reducedMotion;
        }

        lastReportedBestScore = Math.max(lastReportedBestScore, state.bestStage, state.bestEndless);
        lastReportedBestCombo = Math.max(lastReportedBestCombo, state.bestComboAllTime);
        lastReportedUnlockedStage = Math.max(lastReportedUnlockedStage, state.unlockedStage);

        if (state.mode === 'stage' && state.movesCount === 0 && state.status === 'playing' && state.stage !== state.unlockedStage) {
          setupStage(state.unlockedStage);
        } else {
          syncHudDOM();
          renderTrayCanvases();
        }
      } else if (data.type === 'audio-sync') {
        const nextSound = typeof data.soundEnabled === 'boolean'
          ? data.soundEnabled
          : (typeof data.muted === 'boolean' ? !data.muted : !soundEnabled);
        applySoundEnabled(nextSound);
      } else if (data.type === 'molly-boost') {
        if (!data.boostKind || data.boostKind === 'clear_rescue') {
          applyMollyClearRescue();
        }
      }
    });

    window.addEventListener('resize', resizeBoardCanvas);
    if (typeof ResizeObserver === 'function') {
      const ro = new ResizeObserver(() => resizeBoardCanvas());
      ro.observe(document.getElementById('boardWrap'));
      ro.observe(document.getElementById('pieceTray'));
    }

    // Boot!
    syncMuteDOM();
    resizeBoardCanvas();
    setupStage(state.stage);
    requestAnimationFrame(frame);
    postToParent('ready');
  })();
  </script>
</body>
</html>
